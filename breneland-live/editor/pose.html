<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Breneland Pose Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg">
<style>
/* The Pose Editor (pose-editor, Andrew 2026-11-10): Andrew's storyboard tool. Owner only: the server says whose session this is
   (/api/account/resume answers owner: true for his account only); nobody else gets the town. The editor itself runs in the frame:
   the game's own page (/?preview&pose, js/editor/pose/pose-mode.js), the real town with nobody in it, no HUD, no sound. */
:root { --paper: #fff8ec; --ink: #2b2340; --muted: #6d6480; --font-head: 'Fredoka', system-ui, sans-serif; --font: 'Nunito', system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 500 14px var(--font); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
#top { display: flex; gap: 8px; align-items: center; padding: 6px 10px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); border-bottom: 3px solid var(--ink); background: #fff; }
#top h1 { font: 700 18px var(--font-head); margin: 0 auto 0 0; white-space: nowrap; }
#status { font-size: 12.5px; color: var(--muted); }
#wrap { position: relative; min-height: 0; background: #1c1a2e; }
#game { width: 100%; height: 100%; border: 0; display: block; }
#gate { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 8px; background: var(--paper); padding: 20px; }
#gate b { font: 700 24px var(--font-head); }
#gate[hidden] { display: none; }
/* (pose-draw) a phone: a slim top line, the picture gets the room */
@media (max-width: 760px), (max-height: 520px) {
  #top { padding: 3px 8px; padding-top: calc(3px + env(safe-area-inset-top, 0px)); border-bottom-width: 2px; }
  #top h1 { font-size: 15px; }
  #status { display: none; }
}
</style>
</head>
<body>
<div id="top">
  <h1>Pose Editor</h1>
  <span id="status" role="status">Checking who you are...</span>
</div>
<div id="wrap">
  <iframe id="game" title="The Pose Editor" hidden></iframe>
  <div id="gate"><b>One moment...</b><p>Making sure this is Andrew.</p></div>
</div>
<script>
(function () {
  'use strict';
  var status = document.getElementById('status'), gate = document.getElementById('gate'), frame = document.getElementById('game');
  function refuse() {
    gate.hidden = false;
    gate.replaceChildren();
    var b = document.createElement('b'); b.textContent = 'This tool is for Andrew.';
    var p = document.createElement('p'); p.textContent = 'Sign in to Breneland with his name and PIN, then open the Pose Editor from his menu.';
    var a = document.createElement('a'); a.href = '/'; a.textContent = 'Go to Breneland';
    gate.append(b, p, a);
    status.textContent = 'Owner only';
  }
  var token = '';
  try { var acc = JSON.parse(localStorage.getItem('breneland.account') || 'null'); token = acc && typeof acc.token === 'string' ? acc.token : ''; } catch (e) { token = ''; }
  if (!token) { refuse(); return; }
  // the server's word (lib/accounts.js OWNER_KEYS), never a name or a PIN checked here
  fetch('/api/account/resume', { method: 'POST', headers: { 'content-type': 'application/json', 'x-breneland-token': token }, body: '{}', cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      if (!j || j.owner !== true) { refuse(); return; }
      status.textContent = 'Building the town...';
      frame.hidden = false;
      frame.src = '/?preview&pose';
      addEventListener('message', function (e) {
        if (e.origin !== location.origin || !e.data) return;
        if (e.data.type === 'pose-ready') { gate.hidden = true; status.textContent = 'Ready. Press ? for help.'; frame.focus(); }
        if (e.data.type === 'pose-refused') refuse();
      });
    })
    .catch(refuse);
})();
</script>
<!-- tools-menu: "Back to Breneland" (to Andrew's tools menu) -->
<script src="/js/tools-back.js" data-into="#top"></script>
</body>
</html>
