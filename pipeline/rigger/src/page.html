<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rigger</title>
<style>
  html, body { margin:0; height:100%; background:#1b1630; color:#f1ecff; font:14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  #view, #overlay { position:fixed; inset:0; width:100vw; height:100dvh; display:block; touch-action:none; } #overlay { cursor:crosshair; }
  #panel { position:fixed; left:8px; top:8px; width:232px; max-height:calc(100dvh - 16px); overflow-y:auto; background:rgba(22,16,44,.86); border-radius:14px; padding:10px; box-sizing:border-box; backdrop-filter:blur(6px); }
  #panel h2 { margin:10px 0 4px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.65; } #panel h2:first-child { margin-top:0; }
  .row { display:flex; flex-wrap:wrap; gap:5px; margin:3px 0; align-items:center; }
  button, select, .filebtn { border:1px solid rgba(255,255,255,.28); border-radius:9px; background:rgba(255,255,255,.08); color:#fff; font:600 13px inherit; padding:6px 9px; cursor:pointer; } select { flex:1; min-width:0; } select option { color:#111; }
  button.on { background:linear-gradient(135deg,#f59e0b,#ec4899); border-color:#fff; } button.big { flex:1; padding:8px; }
  .filebtn input { display:none; } label.check { display:flex; gap:6px; align-items:center; font-size:13px; flex:1 1 100%; }
  #note { position:fixed; left:250px; right:10px; bottom:10px; background:rgba(22,16,44,.8); border-radius:10px; padding:8px 12px; font-size:13.5px; }
  @media (max-width:640px) { #panel { width:auto; right:8px; max-height:36dvh; } #note { left:8px; } }
</style></head><body>
<canvas id="view"></canvas><canvas id="overlay"></canvas>
<div id="panel">
  <h2>1. Model</h2>
  <div class="row"><label class="filebtn">Load model<input id="file" type="file" accept=".glb,.gltf,.vrm"></label><button id="turnL" title="The model is facing sideways: turn it a quarter">Turn</button><button id="flip" title="The model has its back to you: turn it round">Flip</button></div>
  <h2>2. Skeleton</h2>
  <div class="row"><select id="preset" title="Which kind of body to start from"></select><button id="refit" title="Start again from this kind of skeleton">Reset</button></div>
  <div class="row"><button data-view="front" class="big">Front</button><button data-view="side" class="big">Side</button><button data-view="free" class="big">Free</button></div>
  <div class="row"><button id="toolMove" class="big">Move joints</button><button id="toolDraw" class="big">Draw a limb</button></div>
  <div class="row"><select id="chain" title="Which limb the next line is: draw it from its top to its end"></select></div>
  <div class="row"><label class="check"><input id="mirror" type="checkbox" checked>Left and right mirror</label><label class="check"><input id="carry" type="checkbox" checked>The rest of the limb comes along</label><label class="check"><input id="snap" type="checkbox" checked>Centre in the body when let go</label></div>
  <div class="row"><button id="centreBtn" class="big" title="Put the chosen joint in the middle of the body there">Centre this joint</button></div>
  <h2>3. Attach and save</h2>
  <div class="row"><button id="attach" class="big">Attach the mesh</button><button id="try" class="big">Try a pose</button></div>
  <div class="row"><button id="save" class="big">Save rigged model</button></div>
  <div class="row"><button id="saveSk" title="Save only the joint positions">Save skeleton</button><label class="filebtn">Load skeleton<input id="loadSk" type="file" accept=".json"></label></div>
</div>
<div id="note"></div>
<script>/*BUNDLE*/</script>
</body></html>
