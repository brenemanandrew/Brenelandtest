# Deploys brenai/ (Wizra chat) to brenai.fly.dev. Runs on pushes to main that touch brenai/, or by hand (Actions tab).
# Needs the repo secret FLY_API_TOKEN. The app's own secrets (ANTHROPIC_API_KEY, APP_PASSWORD) are set once with `fly secrets set`.
name: Brenai Deploy
on:
  push:
    branches: [main]
    paths: ['brenai/**', '.github/workflows/brenai-deploy.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: brenai-deploy
    defaults:
      run:
        working-directory: brenai
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl status --app brenai >/dev/null 2>&1 || flyctl apps create brenai
      - run: flyctl volumes list --app brenai | grep -q brenai_data || flyctl volumes create brenai_data --app brenai --region iad --size 1 --yes
      - run: flyctl deploy --remote-only --ha=false
