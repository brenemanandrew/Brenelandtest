# Deploys brenai/ (Wizra chat) to brenai.fly.dev. Runs on pushes to main that touch brenai/, or by hand (Actions tab).
# Needs the repo secret FLY_API_TOKEN. If the repo also has ANTHROPIC_API_KEY and BRENAI_PASSWORD secrets, they are copied to the Fly app.
name: Brenai Deploy
on:
  push:
    branches: [main]
    paths: ['brenai/**', '.github/workflows/brenai-deploy.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: brenai-deploy
    defaults:
      run:
        working-directory: brenai
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl status --app brenai >/dev/null 2>&1 || flyctl apps create brenai
      - run: flyctl volumes list --app brenai | grep -q brenai_data || flyctl volumes create brenai_data --app brenai --region iad --size 1 --yes
      - name: Copy app secrets to Fly (only the ones the repo has)
        env:
          AK: ${{ secrets.ANTHROPIC_API_KEY }}
          PW: ${{ secrets.BRENAI_PASSWORD }}
        run: |
          args=""
          [ -n "$AK" ] && args="$args ANTHROPIC_API_KEY=$AK"
          [ -n "$PW" ] && args="$args APP_PASSWORD=$PW"
          [ -n "$args" ] && flyctl secrets set --stage --app brenai $args || echo "no app secrets in the repo; using what Fly already has"
      - run: flyctl deploy --remote-only --ha=false
