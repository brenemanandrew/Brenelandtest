<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Brenai</title>
<style>
  :root { --bg:#0f0c14; --panel:#1a1522; --line:#3a3046; --text:#e9e4f0; --dim:#9b92a8; --me:#6fa8ff; --her:#ff6b7a; --act:#b79cff; --balloon:#e0566a; --av:104px; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  #app { height:100dvh; display:grid; grid-template-rows: auto auto 1fr auto auto auto; gap:8px; padding:10px; max-width:900px; margin:0 auto; }
  @media (min-width:700px) { :root { --av:150px; } }

  /* top: the avatar (tap to expand) with the brain button on its corner, and her word balloon beside it */
  #top { display:grid; grid-template-columns: var(--av) 1fr; gap:6px; height:var(--av); align-items:center; }
  #stageSlot { width:var(--av); height:var(--av); }
  #stageWrap { position:relative; width:var(--av); height:var(--av); }
  #stage { width:100%; height:100%; border:3px solid var(--line); border-radius:16px; overflow:hidden; background:#000; cursor:pointer; touch-action:none; }
  #bigBtn { position:absolute; left:-8px; bottom:-8px; width:30px; height:30px; border-radius:50%; border:2px solid var(--line); background:var(--panel); color:var(--dim); font-size:15px; line-height:1; padding:0; cursor:pointer; z-index:2; }
  #stage > * { width:100%; height:100%; display:block; object-fit:cover; }
  #brainBtn { position:absolute; right:-8px; bottom:-8px; width:34px; height:34px; border-radius:50%; border:2px solid var(--line); background:var(--panel); font-size:17px; line-height:1; padding:0; cursor:pointer; z-index:2; }
  #stageBack { position:fixed; inset:0; background:rgba(8,6,12,.85); display:none; z-index:12; }
  body.big #stageBack { display:block; }
  body.big #stageWrap { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(92vw,78dvh); height:min(92vw,78dvh); z-index:13; }

  /* word balloons: pop up, scroll when long, fade after a while */
  .bwrap { position:relative; display:flex; min-width:0; opacity:0; transform:translateY(4px); transition:opacity .25s, transform .25s; pointer-events:none; }
  .bwrap.show { opacity:1; transform:none; pointer-events:auto; }
  .balloon { border:2px solid var(--balloon); border-radius:26px; padding:8px 16px; background:var(--panel); font-size:15px; line-height:1.3; overflow-y:auto; overscroll-behavior:contain; white-space:pre-wrap; word-wrap:break-word; }
  .bwrap.her { margin-left:14px; max-height:100%; }
  .bwrap.her .balloon { max-height:var(--av); }
  .bwrap.her::before { content:""; position:absolute; left:-15px; top:calc(50% - 8px); border:8px solid transparent; border-right-color:var(--balloon); }
  .bwrap.me { margin-right:14px; justify-self:end; align-self:center; }
  .bwrap.me .balloon { max-height:72px; }
  .bwrap.me::after { content:""; position:absolute; right:-15px; top:calc(50% - 8px); border:8px solid transparent; border-left-color:var(--balloon); }

  /* chat area: who is talking (name), what they say, and what they do on its own indented line */
  #logHead { display:flex; justify-content:space-between; align-items:baseline; font-size:12px; font-weight:800; letter-spacing:.08em; color:var(--dim); padding:0 4px; margin-top:4px; }
  #brainDot { font-weight:400; letter-spacing:0; }
  #log { background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:8px 12px; overflow-y:auto; min-height:0; }
  .msg { display:grid; grid-template-columns: 4.6em 1fr; column-gap:8px; margin:10px 0; }
  .msg .nm { font-size:13px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding-top:2px; overflow:hidden; text-overflow:ellipsis; }
  .msg.me .nm { color:var(--me); } .msg.her .nm { color:var(--her); }
  .msg .say { white-space:pre-wrap; word-wrap:break-word; }
  .msg .act { padding-left:1.5em; font-weight:700; color:var(--act); }
  .line.err { color:#ff9a9a; font-size:14px; margin:8px 0; }
  .typing { color:var(--dim); font-style:italic; }

  /* action buttons: quick things you do that she reacts to */
  #acts { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  #acts button.edit { color:var(--dim); border-style:dashed; }
  #panel .actrow input:first-child { flex:0 0 30%; }
  #panel .actrow button { background:none; border:1px solid var(--line); }
  #acts button { flex:none; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; font-size:13px; }

  /* bottom: your balloon, your icon, the chat bar with the mic */
  #bottom { display:grid; grid-template-columns: 1fr 72px; gap:6px; height:72px; align-items:center; }
  #meIcon { width:72px; height:72px; border:3px solid var(--line); border-radius:14px; }
  #bar { display:flex; gap:8px; align-items:flex-end; }
  #barTag { align-self:center; font-weight:800; font-size:14px; border:2px solid var(--line); border-radius:8px; padding:4px 8px; }
  #inWrap { position:relative; flex:1; min-width:0; }
  #heardBar { position:absolute; left:14px; right:14px; bottom:100%; height:3px; background:#b04a72; transform-origin:left; transform:scaleX(0); }
  #in { display:block; width:100%; resize:none; max-height:30vh; min-height:44px; padding:10px 16px; border-radius:22px; border:2px solid var(--line); background:var(--panel); color:var(--text); font:inherit; }
  #mic, #send { flex:none; height:44px; width:44px; border-radius:50%; border:2px solid var(--line); background:var(--panel); color:var(--dim); font-size:19px; padding:0; }
  #send { color:#fff; background:#6b4fa3; border-color:#6b4fa3; font-size:16px; }
  #send:disabled { opacity:.5; }
  #mic.on { color:#fff; background:#7a2e4a; border-color:#b04a72; }
  #mic.on.hearing { animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(176,74,114,.6); } 50% { box-shadow:0 0 0 8px rgba(176,74,114,0); } }
  #mic[hidden] { display:none; }

  /* settings wheel */
  #wheel { position:fixed; inset:0; background:rgba(8,6,12,.82); display:none; z-index:15; overflow-y:auto; }
  #wheel.open { display:block; }
  #ring { position:relative; width:280px; height:280px; margin:24px auto 8px; }
  #ring .hub { position:absolute; left:90px; top:90px; width:100px; height:100px; border-radius:50%; overflow:hidden; border:2px solid #4a3a66; cursor:pointer; }
  #ring .hub svg { pointer-events:none; }
  #ring .seg { position:absolute; width:76px; height:76px; margin:-38px 0 0 -38px; border-radius:50%; border:1px solid #4a3a66; background:#221a2e;
               color:var(--text); font:600 12px/1.15 system-ui, sans-serif; display:grid; place-items:center; text-align:center; padding:4px; cursor:pointer; }
  #ring .seg.on { background:#4b3672; }
  #ring .seg small { display:block; font-weight:400; color:var(--dim); font-size:11px; }
  #panel { max-width:520px; margin:0 auto 30px; padding:14px; background:var(--panel); border:1px solid var(--line); border-radius:14px; display:none; }
  #panel.show { display:block; }
  #panel h3 { margin:0 0 10px; font-size:16px; }
  #panel label { display:block; margin:10px 0 4px; color:var(--dim); font-size:13px; }
  #panel input[type=range] { width:100%; }
  #panel textarea, #panel input[type=text] { width:100%; background:#120e18; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; font-size:14px; }
  #panel .chips { display:flex; flex-wrap:wrap; gap:6px; }
  #panel .chip { padding:6px 10px; border-radius:16px; border:1px solid var(--line); background:#120e18; color:var(--text); font-size:14px; }
  #panel .chip.sel { background:#4b3672; border-color:#6b4fa3; }
  #panel .chip.secret { border-style:dashed; }
  #panel .chip .x { margin-left:6px; color:var(--dim); cursor:pointer; }
  #panel .row { display:flex; gap:8px; margin-top:6px; }
  #panel .row input { flex:1; }
  #panel button.small { padding:6px 12px; border-radius:8px; border:0; background:#6b4fa3; color:#fff; font:inherit; font-size:14px; }
  #panel .scale { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); }
  #panel .note { font-size:12px; color:var(--dim); margin-top:6px; }
  #closeWheel { position:fixed; top:10px; right:14px; font-size:26px; background:none; border:0; color:var(--text); z-index:16; }
  #newChat { display:block; margin:0 auto 14px; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; font-size:14px; }
  #login { position:fixed; inset:0; background:var(--bg); display:none; place-items:center; z-index:20; }
  #login form { display:grid; gap:10px; width:260px; }
  #login input, #login button { padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="stageSlot"><div id="stageWrap">
      <!-- The avatar lives in #stage. avatar.js draws the current one; the VTuber replaces it by offering the same calls (see avatar.js). -->
      <div id="stage"></div>
      <button id="bigBtn" title="Expand / shrink">&#10530;</button>
      <button id="brainBtn" title="Her settings">&#129504;</button>
    </div></div>
    <div class="bwrap her" id="herWrap"><div class="balloon" id="herBubble"></div></div>
  </div>
  <div id="logHead"><span>CHAT AREA</span><span id="brainDot">...</span></div>
  <div id="log"></div>
  <div id="acts"></div>
  <div id="bottom">
    <div class="bwrap me" id="meWrap"><div class="balloon" id="meBubble"></div></div>
    <img id="meIcon" src="me.svg" alt="You">
  </div>
  <div id="bar">
    <span id="barTag">Chat</span>
    <div id="inWrap"><div id="heardBar"></div><textarea id="in" rows="1" enterkeyhint="send" placeholder="Talk or type, *actions*"></textarea></div>
    <button id="mic" title="Mic mute / unmute" hidden>&#127908;</button>
    <button id="send" title="Send">&#10148;</button>
  </div>
</div>
<div id="stageBack"></div>
<div id="wheel"><button id="closeWheel" title="Close">&times;</button><div id="ring"></div><div id="panel"></div><button id="newChat">New conversation</button></div>
<div id="login"><form id="loginForm"><div>Password</div><input id="pw" type="password" autocomplete="current-password"><button>Enter</button></form></div>

<script src="avatar.js"></script>
<script>
const $ = id => document.getElementById(id);
const log = $('log'), input = $('in'), sendBtn = $('send'), stage = $('stage');
// Touching her never shows in the chat: it goes to the server quietly and rides along with your next message.
const avatar = WizraAvatar.mount(stage, { onTouch: kind => { fetch('/api/touch', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind }) }).catch(() => {}); } });
let myName = 'You';

// "*waves* hey" -> segments; actions are inside asterisks, speech is everything else. Also counted as actions:
// an asterisk that never closes (her reply is still streaming, or the model forgot), and for Wizra a sentence that
// narrates her in third person without asterisks ("She crosses her arms.").
const NARR = /^\s*(she|wizra)\s+[a-z']+(s|ed)\b/i;
function split(text, who) {
  const out = []; const re = /\*([^*]+)\*|\*([^*]*)$/g; let last = 0, m;
  const say = t => {
    if (who !== 'her') { if (t) out.push({ s: t }); return; }
    for (const sent of t.match(/[^.!?\n]+[.!?]*["')]*\s*|\n+/g) || []) {
      if (NARR.test(sent)) out.push({ a: sent.trim() });
      else if (out.length && out[out.length - 1].s !== undefined) out[out.length - 1].s += sent; else out.push({ s: sent });
    }
  };
  while ((m = re.exec(text))) { if (m.index > last) say(text.slice(last, m.index)); const a = (m[1] ?? m[2]).trim(); if (a) out.push({ a }); last = re.lastIndex; }
  if (last < text.length) say(text.slice(last));
  return out;
}
const speechOf = (text, who) => split(text, who).filter(p => p.s).map(p => p.s).join(' ').replace(/["“”]/g, '').replace(/\s+/g, ' ').trim();

// Bleep filter (display only; what she actually said is kept). Covers common words and their -ing/-ed/-s forms.
const CUSS = /\b(f+u+c+k\w*|motherf\w*|sh[i1]t\w*|bullshit\w*|bitch\w*|bastard\w*|ass(hole|holes|hat|es)?|dumbass\w*|jackass\w*|damn\w*|goddamn\w*|hell|crap\w*|piss\w*|dick\w*|cock\w*|prick\w*|cunt\w*|twat\w*|wtf|stfu|lmfao)\b/gi;
let settings = { bleep: true };
const clean = t => settings.bleep ? t.replace(CUSS, w => w[0] + '#'.repeat(Math.max(2, w.length - 1))) : t;

// An action reads as a line of its own: "he grabs the cookies", "she crosses her arms."
function actLine(who, a) {
  a = a.trim();
  if (/^(he|she|they|i|wizra|his|her|their)\b/i.test(a) || a.toLowerCase().startsWith(myName.toLowerCase())) return a;
  return (who === 'her' ? 'she ' : 'he ') + a.charAt(0).toLowerCase() + a.slice(1);
}
function fill(el, text) {
  const who = el.dataset.who;
  el.textContent = '';
  for (const p of split(clean(text), who)) {
    const t = (p.a ? actLine(who, p.a) : p.s.replace(/["\u201c\u201d]/g, '')).trim(); if (!t) continue;
    const d = document.createElement('div'); d.className = p.a ? 'act' : 'say'; d.textContent = t; el.appendChild(d);
  }
}
function addLine(who, text) {
  const div = document.createElement('div'); div.className = 'msg ' + who;
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = who === 'her' ? 'Wizra' : myName;
  const body = document.createElement('div'); body.dataset.who = who; fill(body, text);
  div.append(nm, body); log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return body;
}
function addError(msg) { const d = document.createElement('div'); d.className = 'line err'; d.textContent = msg; log.appendChild(d); log.scrollTop = log.scrollHeight; }

// Word balloons: speech only. They stay while her reply streams, then fade; scrolling or touching one keeps it up.
const timers = {};
function hideLater(which, ms) { clearTimeout(timers[which]); timers[which] = setTimeout(() => $(which + 'Wrap').classList.remove('show'), ms); }
function bubble(which, text, keep) {
  const el = $(which + 'Bubble'), wrap = $(which + 'Wrap');
  const speech = clean(speechOf(text, which));
  clearTimeout(timers[which]);
  if (!speech) { wrap.classList.remove('show'); return; }
  el.textContent = speech; wrap.classList.add('show');
  if (keep) el.scrollTop = el.scrollHeight; else { el.scrollTop = 0; hideLater(which, 7000 + speech.length * 70); }
}
for (const w of ['her', 'me']) for (const ev of ['scroll', 'pointerdown']) $(w + 'Bubble').addEventListener(ev, () => { if ($(w + 'Wrap').classList.contains('show')) hideLater(w, 9000); }, { passive: true });

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { $('login').style.display = 'grid'; throw new Error('login'); }
  return r;
}

async function load() {
  const r = await api('/api/state'); const s = await r.json();
  myName = s.name || 'You'; if (s.settings) settings = s.settings; drawActs(); avatar.setMood(settings.mood);
  log.textContent = '';
  for (const e of s.log) addLine(e.who, e.text);
}

async function send(quick) {
  const text = (typeof quick === 'string' ? quick : input.value).trim(); if (!text) return;
  if (sendBtn.disabled) { if (typeof quick !== 'string') voice.pending = true; return; } // she is still answering: send this right after
  if (typeof quick !== 'string') { voice.reset(); input.value = ''; autosize(); }
  sendBtn.disabled = true; avatar.setThinking(true); userDid(text);
  addLine('me', text); bubble('me', text);
  const body = addLine('her', ''); body.innerHTML = '<span class="typing">typing...</span>';
  let full = '';
  try {
    const r = await api('/api/chat', { text });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || ('HTTP ' + r.status)); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!chunk.startsWith('data: ')) continue;
        const ev = JSON.parse(chunk.slice(6));
        if (ev.t === 'delta') { full += ev.d; avatar.talk(); avatar.feel(full); fill(body, full); bubble('her', full, true); log.scrollTop = log.scrollHeight; }
        else if (ev.t === 'done') { full = ev.text; fill(body, full); bubble('her', full); }
        else if (ev.t === 'error') throw new Error(ev.error);
      }
    }
  } catch (e) {
    if (e.message !== 'login') { body.parentElement.remove(); addError(e.message); }
  } finally {
    sendBtn.disabled = false; avatar.setThinking(false);
    if (!matchMedia('(pointer:coarse)').matches && !voice.on) input.focus();
    if (voice.pending) { voice.pending = false; send(); }
  }
}

function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, innerHeight * 0.3) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => voice.typed(e));
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
sendBtn.onclick = () => send();

// Action buttons: things you do; she reacts. (Later these can also drive the avatar directly.)
function drawActs() {
  const row = $('acts'); row.textContent = '';
  for (const [name, act] of settings.acts || []) { const b = document.createElement('button'); b.textContent = name; b.title = act; b.onclick = () => send('*' + act + '*'); row.appendChild(b); }
  const e = document.createElement('button'); e.textContent = '\u270e'; e.title = 'Edit these buttons'; e.className = 'edit';
  e.onclick = () => openWheel().then(() => openPanel('acts')).catch(() => {});
  row.appendChild(e);
}

// The avatar: tap to expand to a big view, tap again (or outside) to shrink.
$('bigBtn').onclick = () => document.body.classList.toggle('big');
// Things you do to her in the chat (typed or from the action buttons) also land on the avatar straight away.
const DID = [[/\bpoke|\bprod|\bjab/i, 'poke'], [/\bboop/i, 'boop'], [/\bpat|\bpet\b|ruffl|\bhug|head ?pat/i, 'pat'], [/\bswat|\bsmack|\bbonk|\bflick/i, 'swat'], [/\bwave|high five/i, 'wave'], [/\blaugh|\bgrin|\bsmile/i, 'laugh'], [/\bstare|\bglare/i, 'stare'], [/\bhand(s)? her|\bgive(s)? her|\bslide(s)? .* to her|\boffer/i, 'gift']];
function userDid(text) { for (const p of split(text, 'me')) if (p.a) for (const [re, kind] of DID) if (re.test(p.a)) return avatar.react(kind); }
$('stageBack').onclick = () => document.body.classList.remove('big');
$('newChat').onclick = async () => { if (confirm('Start a new conversation? She keeps what she has learned about you.')) { await api('/api/reset', {}); closeWheel(); load(); } };
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) });
  if (r.ok) { $('login').style.display = 'none'; load(); voice.start(); } else $('pw').value = '';
};
// ---------- voice input (talk to text) ----------
// The browser's own speech recognition (Chrome, Edge, Safari; not Firefox). On by default; remembered per device.
// It keeps listening; once you stop talking for `wait` seconds, what it heard is sent to Wizra.
const voice = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const saved = JSON.parse(localStorage.getItem('brenai.voice') || '{}');
  const v = { supported: !!SR, on: SR ? saved.on !== false : false, wait: saved.wait || 2.5, pending: false };
  let rec = null, running = false, prefix = '', heard = '', interim = '', timer = null, barT = null, gestureHook = false;
  const mic = $('mic'), bar = $('heardBar');
  const store = () => localStorage.setItem('brenai.voice', JSON.stringify({ on: v.on, wait: v.wait }));
  const show = () => { mic.hidden = !SR; mic.classList.toggle('on', v.on); mic.classList.toggle('hearing', v.on && running); };
  const write = () => { input.value = (prefix + ' ' + heard + ' ' + interim).replace(/\s+/g, ' ').trim(); autosize(); };
  function countdown() {
    clearTimeout(timer); cancelAnimationFrame(barT);
    if (!(heard + interim).trim()) { bar.style.transform = 'scaleX(0)'; return; }
    const t0 = performance.now(), ms = v.wait * 1000;
    const tick = () => { const f = Math.min(1, (performance.now() - t0) / ms); bar.style.transform = `scaleX(${f})`; if (f < 1) barT = requestAnimationFrame(tick); };
    tick();
    timer = setTimeout(() => { heard = (heard + ' ' + interim).trim(); interim = ''; write(); send(); }, ms);
  }
  function start() {
    if (!SR || !v.on || running) return;
    rec = new SR(); rec.lang = navigator.language || 'en-US'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = e => {
      interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) heard += ' ' + t; else interim += t;
      }
      write(); countdown();
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        // no permission yet (or the browser wants a tap first): try again on the next tap
        if (!gestureHook) { gestureHook = true; addEventListener('pointerdown', () => { gestureHook = false; start(); }, { once: true }); }
      }
    };
    rec.onend = () => { running = false; show(); if (v.on && !document.hidden) setTimeout(start, 400); };
    try { rec.start(); running = true; } catch { running = false; }
    show();
  }
  function stop() { clearTimeout(timer); try { rec && rec.stop(); } catch {} running = false; show(); }
  v.set = (patch) => { Object.assign(v, patch); store(); if (v.on) start(); else stop(); show(); };
  v.reset = () => { clearTimeout(timer); cancelAnimationFrame(barT); bar.style.transform = 'scaleX(0)'; prefix = heard = interim = ''; };
  // typing by hand takes over: no auto-send of what you are typing; speech after it is added on
  v.typed = e => { if (e.key === 'Enter') return; clearTimeout(timer); cancelAnimationFrame(barT); bar.style.transform = 'scaleX(0)'; setTimeout(() => { prefix = input.value; heard = interim = ''; }, 0); };
  mic.onclick = () => v.set({ on: !v.on });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
  v.start = start;
  show();
  return v;
})();

// ---------- the wheel ----------
let sheet = null, notes = '';
const MOODS = ['auto', 'happy', 'playful', 'chill', 'focused', 'excited', 'tired', 'grumpy', 'sad', 'anxious'];
const LABEL = v => v < 20 ? 'very low' : v < 40 ? 'low' : v < 60 ? 'middle' : v < 80 ? 'high' : 'very high';
async function saveSettings(patch) {
  const r = await api('/api/settings', patch); const d = await r.json();
  settings = d.settings; sheet = d.sheet; drawRing(); redrawLog();
}
function redrawLog() { load().catch(() => {}); }
function el(tag, props = {}, ...kids) { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids); return e; }

const SEGS = [
  { k: 'mood', name: 'Emotion', sub: () => settings.mood },
  { k: 'react', name: 'Reactions', sub: () => (settings.length || 'short') + ' replies' },
  { k: 'temp', name: 'Temperature', sub: () => LABEL(settings.temperature) },
  { k: 'sfw', name: 'SFW', sub: () => settings.sfw ? 'on' : 'off', toggle: 'sfw' },
  { k: 'bleep', name: 'Bleep', sub: () => settings.bleep ? 'on' : 'off', toggle: 'bleep' },
  { k: 'sheet', name: 'Character', sub: () => sheet ? 'rapport ' + sheet.rapport : '' },
  { k: 'secret', name: 'Hidden likes', sub: () => sheet ? sheet.hiddenLikes.length + '' : '' },
  { k: 'voice', name: 'Talk to text', sub: () => !voice.supported ? 'n/a' : voice.on ? voice.wait + 's' : 'off' },
];
function drawRing() {
  const ring = $('ring'); ring.textContent = '';
  const hub = el('div', { className: 'hub', onclick: closeWheel }); WizraAvatar.mount(hub); ring.append(hub);
  SEGS.forEach((g, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / SEGS.length;
    const b = el('div', { className: 'seg' + (g.toggle && settings[g.toggle] ? ' on' : '') });
    b.style.left = (140 + 105 * Math.cos(a)) + 'px'; b.style.top = (140 + 105 * Math.sin(a)) + 'px';
    b.append(g.name, el('small', { textContent: g.sub() }));
    b.onclick = () => g.toggle ? saveSettings({ settings: { [g.toggle]: !settings[g.toggle] } }) : openPanel(g.k);
    ring.append(b);
  });
}
function slider(title, key, lo, hi, note) {
  const out = el('div');
  const r = el('input', { type: 'range', min: 0, max: 100, value: settings[key] });
  r.onchange = () => saveSettings({ settings: { [key]: +r.value } });
  out.append(el('h3', { textContent: title }), r, el('div', { className: 'scale' }, el('span', { textContent: lo }), el('span', { textContent: hi })));
  if (note) out.append(el('div', { className: 'note', textContent: note }));
  return out;
}
function listEditor(title, key, secret) {
  const box = el('div'); box.append(el('label', { textContent: title }));
  const chips = el('div', { className: 'chips' });
  const items = sheet[key];
  items.forEach((it, i) => {
    const text = secret ? it.text : it;
    const c = el('span', { className: 'chip' + (secret ? (it.revealed ? ' sel' : ' secret') : ''), textContent: text + (secret && it.grown ? ' (grew)' : '') });
    if (secret) { c.title = it.revealed ? 'She has told you. Tap to make it secret again.' : 'Still secret. Tap to mark revealed.'; c.onclick = () => { items[i].revealed = !items[i].revealed; saveSettings({ sheet: { [key]: items } }).then(() => openPanel(cur)); }; }
    const x = el('span', { className: 'x', textContent: '×' });
    x.onclick = ev => { ev.stopPropagation(); items.splice(i, 1); saveSettings({ sheet: { [key]: items } }).then(() => openPanel(cur)); };
    c.append(x); chips.append(c);
  });
  const inp = el('input', { type: 'text', placeholder: 'add one' });
  const add = el('button', { className: 'small', textContent: 'Add' });
  add.onclick = () => { const v = inp.value.trim(); if (!v) return; items.push(secret ? { text: v, revealed: false } : v); saveSettings({ sheet: { [key]: items } }).then(() => openPanel(cur)); };
  box.append(chips, el('div', { className: 'row' }, inp, add));
  return box;
}
let cur = null;
function openPanel(k) {
  cur = k; const p = $('panel'); p.textContent = ''; p.classList.add('show');
  if (k === 'mood') {
    p.append(el('h3', { textContent: 'Emotion' }));
    const chips = el('div', { className: 'chips' });
    for (const m of MOODS) { const c = el('span', { className: 'chip' + (settings.mood === m ? ' sel' : ''), textContent: m }); c.onclick = () => saveSettings({ settings: { mood: m } }).then(() => openPanel('mood')); chips.append(c); }
    p.append(chips, el('div', { className: 'note', textContent: 'auto lets her mood follow the conversation.' }));
  } else if (k === 'react') {
    p.append(slider('How she reacts', 'expressiveness', 'reserved, dry', 'big, dramatic'), el('label', { textContent: 'Reply length' }));
    const chips = el('div', { className: 'chips' });
    for (const m of ['short', 'medium', 'long']) { const c = el('span', { className: 'chip' + ((settings.length || 'short') === m ? ' sel' : ''), textContent: m }); c.onclick = () => saveSettings({ settings: { length: m } }).then(() => openPanel('react')); chips.append(c); }
    p.append(chips, el('div', { className: 'note', textContent: 'short = one to three sentences, like texting.' }));
  } else if (k === 'temp') {
    p.append(slider('Temperature', 'temperature', 'predictable', 'wild', 'Real sampling temperature on your PC model (0.3 to 1.2, middle is 0.75), plus a matching hint in her instructions. Lower if she rambles or gets odd.'));
  } else if (k === 'sheet') {
    p.append(el('h3', { textContent: 'Character' }));
    const bd = el('input', { type: 'text', value: sheet.birthday });
    const bs = el('textarea', { rows: 6, value: sheet.backstory });
    const saveTxt = el('button', { className: 'small', textContent: 'Save birthday + backstory' });
    saveTxt.onclick = () => saveSettings({ sheet: { birthday: bd.value, backstory: bs.value } }).then(() => openPanel('sheet'));
    const rp = el('input', { type: 'range', min: 0, max: 100, value: sheet.rapport }); rp.onchange = () => saveSettings({ sheet: { rapport: +rp.value } }).then(() => openPanel('sheet'));
    const cl = el('input', { type: 'range', min: 0, max: 3, step: 1, value: sheet.cussLevel }); cl.onchange = () => saveSettings({ sheet: { cussLevel: +cl.value } }).then(() => openPanel('sheet'));
    const dev = el('input', { type: 'checkbox', checked: settings.cussDevelop }); dev.onchange = () => saveSettings({ settings: { cussDevelop: dev.checked } });
    p.append(el('label', { textContent: 'Birthday' }), bd, el('label', { textContent: 'Backstory' }), bs, el('div', { className: 'row' }, saveTxt),
      listEditor('Likes', 'likes'), listEditor('Dislikes', 'dislikes'),
      el('label', { textContent: 'Rapport: ' + sheet.rapport + '/100 (moves on its own as you talk)' }), rp,
      el('label', { textContent: 'Cussing: ' + ['never', 'mild', 'casual', 'free'][sheet.cussLevel] }), cl,
      el('label', {}, dev, ' Let her pick up cussing over time (only once rapport is 60+ and you cuss yourself)'));
    const nt = el('textarea', { rows: 8, value: notes });
    const saveN = el('button', { className: 'small', textContent: 'Save notes' }); saveN.onclick = () => api('/api/settings', { notes: nt.value }).then(() => { notes = nt.value; saveN.textContent = 'Saved'; });
    p.append(el('label', { textContent: 'Her private notes about you (she rewrites these every few messages; edit or clear them if she picked up something wrong)' }), nt, el('div', { className: 'row' }, saveN));
  } else if (k === 'acts') {
    p.append(el('h3', { textContent: 'Action buttons' }), el('div', { className: 'note', textContent: 'Button name on the left, what you do on the right (it shows in the chat as "he ..."). Empty rows are removed.' }));
    const rows = el('div');
    const addRow = (n = '', a = '') => {
      const x = el('button', { className: 'small', textContent: '\u00d7' }); const r = el('div', { className: 'row actrow' }, el('input', { type: 'text', value: n, placeholder: 'Name', maxLength: 20 }), el('input', { type: 'text', value: a, placeholder: 'what you do, e.g. waves at her', maxLength: 140 }), x);
      x.onclick = () => r.remove(); rows.append(r);
    };
    for (const [n, a] of settings.acts || []) addRow(n, a);
    const add = el('button', { className: 'small', textContent: '+ Add button' }); add.onclick = () => addRow();
    const save = el('button', { className: 'small', textContent: 'Save' });
    save.onclick = () => saveSettings({ settings: { acts: [...rows.children].map(r => [...r.querySelectorAll('input')].map(i => i.value)) } }).then(closeWheel);
    p.append(rows, el('div', { className: 'row' }, add, save));
  } else if (k === 'voice') {
    p.append(el('h3', { textContent: 'Talk to text' }));
    if (!voice.supported) { p.append(el('div', { className: 'note', textContent: 'This browser has no speech recognition. Use Chrome, Edge or Safari.' })); return; }
    const on = el('input', { type: 'checkbox', checked: voice.on }); on.onchange = () => { voice.set({ on: on.checked }); drawRing(); };
    const w = el('input', { type: 'range', min: 1, max: 8, step: 0.5, value: voice.wait });
    const lab = el('label', { textContent: 'Send after you stop talking for ' + voice.wait + ' s' });
    w.oninput = () => { lab.textContent = 'Send after you stop talking for ' + w.value + ' s'; };
    w.onchange = () => { voice.set({ wait: +w.value }); drawRing(); };
    p.append(el('label', {}, on, ' Listen (on by default; the mic button by the text box turns it on and off)'), lab, w,
      el('div', { className: 'scale' }, el('span', { textContent: 'quick' }), el('span', { textContent: 'patient' })),
      el('div', { className: 'note', textContent: 'A thin bar over the text box fills while it waits. Typing stops the auto-send for that message. Speech is turned into text by your browser (Chrome and Edge use Google or Microsoft servers for this).' }));
  } else if (k === 'secret') {
    p.append(el('h3', { textContent: 'Hidden likes' }), el('div', { className: 'note', textContent: 'Dashed = still secret, filled = she has told you. Tap one to flip it. She can grow new ones from good moments; those say (grew). She only admits a secret once she trusts you enough.' }), listEditor('', 'hiddenLikes', true));
  }
}
async function openWheel() {
  const r = await api('/api/settings'); const d = await r.json(); settings = d.settings; sheet = d.sheet; notes = d.notes || '';
  drawRing(); $('panel').classList.remove('show'); $('wheel').classList.add('open');
}
function closeWheel() { $('wheel').classList.remove('open'); }
$('closeWheel').onclick = closeWheel;
$('brainBtn').onclick = () => { document.body.classList.remove('big'); openWheel().catch(() => {}); };

async function brainStatus() {
  try {
    const b = await (await fetch('/api/brain')).json();
    $('brainDot').textContent = b.online ? '\u25cf PC online' + (b.bridge < b.bridgeLatest ? ' (restart bridge to update)' : '') : b.fallback ? '\u25cf Claude' : '\u25cb offline';
    $('brainDot').style.color = b.online ? '#7bd88f' : b.fallback ? '#d4b8ff' : '#ff9a9a';
  } catch {}
}
brainStatus(); setInterval(brainStatus, 20000);
load().then(() => voice.start()).catch(() => {});
</script>
