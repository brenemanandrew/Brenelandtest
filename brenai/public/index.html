<style>
  :root { --bg:#0f0c14; --panel:#1a1522; --line:#3a3046; --text:#e9e4f0; --dim:#9b92a8; --me:#6fa8ff; --her:#ff6b7a; --act:#b79cff; --balloon:#e0566a; --av:104px; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  #app { height:100dvh; display:grid; grid-template-rows: auto auto 1fr auto auto auto; gap:8px; padding:10px; max-width:900px; margin:0 auto; }
  @media (min-width:700px) { :root { --av:150px; } }

  /* top: the avatar (tap to expand) with the brain button on its corner, and her word balloon beside it */

  #stageSlot { width:var(--av); height:var(--av); }
  #stageWrap { position:relative; width:var(--av); height:var(--av); }
  #stage { width:100%; height:100%; border:3px solid var(--line); border-radius:16px; overflow:hidden; background:#000; cursor:pointer; touch-action:none; position:relative; }
  /* icons round the two pictures: no bubbles, bigger, drawn in white with a soft glow round them */
  #visitBtn, #bigBtn, #brainBtn, #actBtn, #senseBtn { background:none !important; border:0 !important; box-shadow:none !important; width:32px !important; height:32px !important; font-size:20px !important; line-height:1 !important; padding:0 !important; color:#fff !important; cursor:pointer; opacity:.82; filter:drop-shadow(0 0 1px rgba(255,255,255,.95)) drop-shadow(0 0 4px rgba(255,255,255,.45)); transition:transform .15s, opacity .15s; }
  #visitBtn:hover, #bigBtn:hover, #brainBtn:hover, #actBtn:hover, #senseBtn:hover { opacity:1; }
  #visitBtn:active, #bigBtn:active, #brainBtn:active, #actBtn:active, #senseBtn:active { transform:scale(.9); }
  #visitBtn { left:-9px !important; top:-9px !important; } #bigBtn { left:-9px !important; bottom:-9px !important; } #brainBtn { right:-9px !important; bottom:-9px !important; } #actBtn { left:-10px !important; top:-10px !important; }
  #senseBtn { position:absolute; right:-9px; bottom:-9px; z-index:3; } #senseBtn svg { width:100%; height:100%; display:block; } #camBtn, #mic { display:none !important; }
  body.fp #brainBtn { right:10px !important; top:10px !important; bottom:auto !important; }
  #fly { position:fixed; inset:0; z-index:40; display:grid; place-items:center; background:rgba(20,10,44,.72); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); font-family:"Fredoka",system-ui,sans-serif; }
  .flyRing { position:relative; } .flyHub { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:84px; height:84px; border-radius:50%; border:0; font-size:40px; background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.35), 0 10px 30px rgba(0,0,0,.45); cursor:pointer; }
  .flyItem { position:absolute; transform:translate(-50%,-50%); width:104px; border:0; background:none; color:#fff; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; font:600 12.5px "Fredoka",sans-serif; text-align:center; line-height:1.15; animation:flyIn .28s cubic-bezier(.2,1.4,.4,1) backwards; }
  .flyItem i { font-style:normal; width:66px; height:66px; border-radius:50%; display:grid; place-items:center; font-size:32px; background:linear-gradient(135deg, hsl(var(--hue) 85% 66%), hsl(calc(var(--hue) + 40) 80% 58%)); box-shadow:0 0 0 2px rgba(255,255,255,.9), 0 0 16px rgba(255,255,255,.45), 0 6px 16px hsl(var(--hue) 80% 40% / .5); transition:transform .12s; } .flyItem:active i { transform:scale(.9); }
  .flyItem.off { opacity:.55; cursor:default; } .flyItem.off i { background:rgba(255,255,255,.16); box-shadow:0 0 0 2px rgba(255,255,255,.4); } @keyframes flyIn { from { opacity:0; transform:translate(-50%,-50%) scale(.3); } }
  body.solo #fpMoments { display:none !important; }
  /* the buttons live together in one dock at the top right: white line drawings on dark rounds, easy to find and to hit */
  #dock { position:fixed; right:10px; top:calc(8px + env(safe-area-inset-top)); z-index:12; display:flex; gap:6px; padding:5px; border-radius:999px; background:rgba(24,14,48,.62); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); box-shadow:0 4px 16px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.14); }
  #dock button { position:static !important; width:42px !important; height:42px !important; border-radius:50% !important; background:rgba(255,255,255,.12) !important; color:#fff !important; opacity:1 !important; filter:none !important; padding:0 !important; font-size:25px !important; line-height:1 !important; display:grid; place-items:center; transition:background .15s, transform .12s; }
  #dock button:hover { background:rgba(255,255,255,.24) !important; } #dock button:active { transform:scale(.9); } #dock button svg { width:24px; height:24px; display:block; } 
  #dock button[hidden] { display:none !important; } body.calling #dock, body.intro #dock { display:none; } body.fp #dock { top:calc(8px + env(safe-area-inset-top)); }
  @media (max-width:640px) { #dock { right:6px; top:calc(5px + env(safe-area-inset-top)); gap:3px; padding:3px; background:rgba(24,14,48,.45); box-shadow:inset 0 0 0 1px rgba(255,255,255,.1); } #dock button { width:30px !important; height:30px !important; font-size:17px !important; background:rgba(255,255,255,.08) !important; } #dock button svg { width:17px; height:17px; } }   /* phones: the menu bar stays out of the way */
  /* behind everything: the player's own room, out of focus */
  body.hasroom { background:none !important; }
  body::before { content:""; position:fixed; inset:-40px; z-index:-1; background:var(--roombg, none) center/cover no-repeat; filter:blur(16px) brightness(.5) saturate(1.25); pointer-events:none; }
  /* the look of the picture: richer colour, a warm light leak from the top corner, soft dark edges; weather lays its own mood over it */
  #stage canvas { filter:saturate(1.22) contrast(1.07) brightness(1.02); }
  #stage::before, #stage::after { content:""; position:absolute; inset:0; pointer-events:none; z-index:1; }
  #stage::before { background:radial-gradient(120% 90% at 12% 0%, rgba(255,214,150,.30), rgba(255,160,200,.10) 38%, transparent 62%), linear-gradient(200deg, transparent 55%, rgba(80,60,200,.16)); mix-blend-mode:screen; transition:background 1.5s; }
  #stage::after { background:radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(22,8,48,.42) 100%); transition:background 1.5s; }
  #stage[data-weather=rainy]::before { background:linear-gradient(180deg, rgba(120,160,230,.20), rgba(60,90,170,.14)); } #stage[data-weather=rainy]::after { background:radial-gradient(ellipse at 50% 46%, transparent 44%, rgba(12,18,48,.55) 100%); }
  #stage[data-weather=stormy]::before { background:linear-gradient(180deg, rgba(90,110,200,.26), rgba(40,40,120,.22)); } #stage[data-weather=stormy]::after { background:radial-gradient(ellipse at 50% 46%, transparent 38%, rgba(8,8,36,.66) 100%); }
  #stage[data-power=out]::before { background:linear-gradient(180deg, rgba(40,50,140,.30), rgba(10,10,60,.34)) !important; } #stage[data-power=out]::after { background:radial-gradient(ellipse at 50% 46%, transparent 22%, rgba(2,2,20,.82) 100%) !important; } #stage[data-power=out] canvas { filter:saturate(.75) contrast(1.15) brightness(.92); }
  #stage[data-weather=snowy]::before { background:linear-gradient(180deg, rgba(225,238,255,.26), rgba(190,210,255,.12)); } #stage[data-weather=cloudy]::before, #stage[data-weather=foggy]::before { background:linear-gradient(180deg, rgba(200,205,225,.18), rgba(150,155,190,.12)); }
  #bigBtn { position:absolute; left:-8px; bottom:-8px; width:30px; height:30px; border-radius:50%; border:2px solid var(--line); background:var(--panel); color:var(--dim); font-size:15px; line-height:1; padding:0; cursor:pointer; z-index:2; }
  #stage > * { width:100%; height:100%; display:block; object-fit:cover; }
  #brainBtn { position:absolute; right:-8px; bottom:-8px; width:34px; height:34px; border-radius:50%; border:2px solid var(--line); background:var(--panel); font-size:17px; line-height:1; padding:0; cursor:pointer; z-index:2; }
  #stageBack { position:fixed; inset:0; background:rgba(8,6,12,.85); display:none; z-index:12; }
  body.big #stageBack { display:block; }
  body.big #stageWrap { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(92vw,78dvh); height:min(92vw,78dvh); z-index:13; }

  /* word balloons: pop up, scroll when long, fade after a while */
  .bwrap { position:relative; display:flex; min-width:0; opacity:0; transform:translateY(4px); transition:opacity .25s, transform .25s; pointer-events:none; }
  .bwrap.show { opacity:1; transform:none; pointer-events:auto; }
  .balloon { border:2px solid var(--balloon); border-radius:26px; padding:8px 16px; background:var(--panel); font-size:15px; line-height:1.3; overflow-y:auto; overscroll-behavior:contain; white-space:pre-wrap; word-wrap:break-word; }
  .bwrap.her { margin-left:14px; max-height:100%; }
  .bwrap.her .balloon { max-height:var(--av); }
  .bwrap.her::before { content:""; position:absolute; left:-15px; top:calc(50% - 8px); border:8px solid transparent; border-right-color:var(--balloon); }
  .bwrap.me { margin-right:14px; justify-self:end; align-self:center; }
  .bwrap.me .balloon { max-height:72px; }
  .bwrap.me::after { content:""; position:absolute; right:-15px; top:calc(50% - 8px); border:8px solid transparent; border-left-color:var(--balloon); }

  /* chat area: who is talking (name), what they say, and what they do on its own indented line */
  #logHead { display:flex; justify-content:space-between; align-items:baseline; font-size:12px; font-weight:800; letter-spacing:.08em; color:var(--dim); padding:0 4px; margin-top:4px; }
  #brainDot { font-weight:400; letter-spacing:0; }
  #log { background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:8px 12px; overflow-y:auto; min-height:0; }
  .msg { display:grid; grid-template-columns: 4.6em 1fr; column-gap:8px; margin:10px 0; }
  .msg .nm { font-size:13px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding-top:2px; overflow:hidden; text-overflow:ellipsis; }
  .msg.me .nm { color:var(--me); } .msg.her .nm { color:var(--her); }
  .msg .say { white-space:pre-wrap; word-wrap:break-word; }
  .msg .act { padding-left:1.5em; font-weight:700; color:var(--act); }
  .line.err { color:#ff9a9a; font-size:14px; margin:8px 0; }
  .typing { color:var(--dim); font-style:italic; }

  /* action buttons: quick things you do that she reacts to */
  #acts { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  #acts button.edit { color:var(--dim); border-style:dashed; }
  #panel .actrow input:first-child { flex:0 0 30%; }
  #panel .actrow button { background:none; border:1px solid var(--line); }
  #acts button { flex:none; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; font-size:13px; }

  /* bottom: your balloon, your icon, the chat bar with the mic */
  #bottom { display:grid; grid-template-columns: 1fr 72px; gap:6px; height:72px; align-items:center; }
  #meIcon { width:72px; height:72px; border:3px solid var(--line); border-radius:14px; }
  #bar { display:flex; gap:8px; align-items:flex-end; }
  #barTag { align-self:center; font-weight:800; font-size:14px; border:2px solid var(--line); border-radius:8px; padding:4px 8px; }
  #inWrap { position:relative; flex:1; min-width:0; }
  #heardBar { position:absolute; left:14px; right:14px; bottom:100%; height:3px; background:#b04a72; transform-origin:left; transform:scaleX(0); }
  #in { display:block; width:100%; resize:none; max-height:30vh; min-height:44px; padding:10px 16px; border-radius:22px; border:2px solid var(--line); background:var(--panel); color:var(--text); font:inherit; }
  #mic, #send { flex:none; height:44px; width:44px; border-radius:50%; border:2px solid var(--line); background:var(--panel); color:var(--dim); font-size:19px; padding:0; }
  #send { color:#fff; background:#6b4fa3; border-color:#6b4fa3; font-size:16px; }
  #send:disabled { opacity:.5; }
  #mic.on { color:#fff; background:#7a2e4a; border-color:#b04a72; }
  #mic.on.hearing { animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(176,74,114,.6); } 50% { box-shadow:0 0 0 8px rgba(176,74,114,0); } }
  #mic[hidden] { display:none; }

  /* settings wheel */
  #wheel { position:fixed; inset:0; background:rgba(8,6,12,.82); display:none; z-index:15; overflow-y:auto; }
  #wheel.open { display:block; }
  #ring { position:relative; width:280px; height:280px; margin:24px auto 8px; }
  #ring .hub { position:absolute; left:90px; top:90px; width:100px; height:100px; border-radius:50%; overflow:hidden; border:2px solid #4a3a66; cursor:pointer; }
  #ring .hub svg { pointer-events:none; }
  #ring .seg { position:absolute; width:72px; height:72px; margin:-36px 0 0 -36px; border-radius:50%; border:1px solid #4a3a66; background:#221a2e;
               color:var(--text); font:600 12px/1.15 system-ui, sans-serif; display:grid; place-items:center; text-align:center; padding:4px; cursor:pointer; }
  #ring .seg.on { background:#4b3672; }
  #ring .seg small { display:block; font-weight:400; color:var(--dim); font-size:11px; }
  #panel { max-width:520px; margin:0 auto 30px; padding:14px; background:var(--panel); border:1px solid var(--line); border-radius:14px; display:none; }
  #panel.show { display:block; }
  #panel h3 { margin:0 0 10px; font-size:16px; }
  #panel label { display:block; margin:10px 0 4px; color:var(--dim); font-size:13px; }
  #panel input[type=range] { width:100%; }
  #panel textarea, #panel input[type=text] { width:100%; background:#120e18; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; font-size:14px; }
  #panel .chips { display:flex; flex-wrap:wrap; gap:6px; }
  #panel .chip { padding:6px 10px; border-radius:16px; border:1px solid var(--line); background:#120e18; color:var(--text); font-size:14px; }
  #panel .chip.sel { background:#4b3672; border-color:#6b4fa3; }
  #panel .chip.secret { border-style:dashed; }
  #panel .chip .x { margin-left:6px; color:var(--dim); cursor:pointer; }
  #panel .row { display:flex; gap:8px; margin-top:6px; }
  #panel .row input { flex:1; }
  #panel button.small { padding:6px 12px; border-radius:8px; border:0; background:#6b4fa3; color:#fff; font:inherit; font-size:14px; }
  #panel .scale { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); }
  #panel .note { font-size:12px; color:var(--dim); margin-top:6px; }
  #closeWheel { position:fixed; top:10px; right:14px; font-size:26px; background:none; border:0; color:var(--text); z-index:16; }
  #login { position:fixed; inset:0; background:var(--bg); display:none; place-items:center; z-index:20; }
  #login { align-content:center; gap:22px; } #brainBox { width:260px; display:grid; gap:8px; text-align:center; font-size:13px; } #brainBox[hidden] { display:none; } #brainBox.on #brainStart, #brainBox.on details { display:none; } #brainState::before { content:''; display:inline-block; width:9px; height:9px; border-radius:50%; background:#ff6b7a; margin-right:7px; } #brainBox.on #brainState::before { background:#5fe08a; }
  #brainStart { display:block; padding:10px; border-radius:999px; background:rgba(255,255,255,.16); color:#fff; font-weight:600; text-decoration:none; border:1px solid rgba(255,255,255,.3); } #brainBox details { opacity:.85; } #brainBox summary { cursor:pointer; } #brainBox code { display:block; margin:6px 0; padding:8px; border-radius:8px; background:rgba(0,0,0,.35); font-size:11.5px; word-break:break-all; user-select:all; }
  #login form { display:grid; gap:10px; width:260px; } #login form[hidden], #login input[hidden] { display:none; } #login button.quiet { background:rgba(255,255,255,.12) !important; font-weight:500 !important; } #pinMsg { font-size:13px; min-height:18px; opacity:.85; text-align:center; }
  #login input, #login button { padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; }

  /* ================= theme: twilight (2026-11-17). Warmer and brighter than the first near-black look. ================= */
  :root { --bg:#241a45; --panel:rgba(255,255,255,.08); --solid:#2f2256; --line:rgba(255,255,255,.2); --text:#fbf7ff; --dim:#cfc3ea; --me:#7fd0ff; --her:#ff9cc4; --act:#d3b6ff; --balloon:#ff9cc4; --grad:linear-gradient(135deg,#ff8fc0,#a98bff); }
  html, body { font-family: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  body { background:
      radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,.55), transparent 60%), radial-gradient(1.5px 1.5px at 78% 9%, rgba(255,255,255,.5), transparent 60%),
      radial-gradient(2px 2px at 64% 31%, rgba(255,255,255,.35), transparent 60%), radial-gradient(1.5px 1.5px at 31% 44%, rgba(255,255,255,.3), transparent 60%),
      radial-gradient(1.5px 1.5px at 90% 52%, rgba(255,255,255,.3), transparent 60%),
      radial-gradient(120% 60% at 50% 110%, #ff8fb8 0%, rgba(255,143,184,0) 60%), linear-gradient(170deg,#1f1a4a 0%,#3a2470 38%,#6a3586 72%,#b05a8f 100%) fixed; }
  #stage { border:0; border-radius:22px; box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 0 0 6px rgba(255,156,196,.55), 0 10px 30px rgba(255,120,180,.35); }
  #brainBtn, #bigBtn { border:0; background:#fff; color:#6a3aa8; box-shadow:0 3px 10px rgba(0,0,0,.3); }
  .balloon { border-width:0; background:#fff; color:#3a2358; border-radius:22px; box-shadow:0 6px 18px rgba(0,0,0,.25); font-weight:500; }
  .bwrap.her .balloon { background:linear-gradient(135deg,#fff,#ffe3f0); } .bwrap.her::before { border-right-color:#fff; }
  .bwrap.me .balloon { background:linear-gradient(135deg,#e6f6ff,#fff); } .bwrap.me::after { border-left-color:#fff; }
  #logHead { color:rgba(255,255,255,.75); }
  #log { border:1px solid var(--line); border-radius:20px; background:rgba(20,12,45,.38); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }

  #mic { border:0; background:rgba(255,255,255,.16); color:#fff; }
  #mic.on { background:linear-gradient(135deg,#ff6fa5,#ff9c6f); }
  #send { border:0; background:var(--grad); box-shadow:0 4px 14px rgba(255,120,190,.45); }
  #heardBar { background:#ffd166; }
  /* the wheel: an icon in a coloured bubble, the name and its state underneath */
  #wheel { background:rgba(28,18,60,.86); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  #ring { width:344px; height:372px; margin:22px auto 0; }
  #ring .hub { left:112px; top:104px; width:120px; height:120px; border:0; box-shadow:0 0 0 3px #fff, 0 0 0 7px rgba(255,156,196,.5), 0 8px 26px rgba(0,0,0,.4); }
  #ring .seg { width:84px; height:auto; margin:-34px 0 0 -42px; border:0; background:none; padding:0; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; }
  #ring .seg .ic { width:54px; height:54px; border-radius:50%; display:grid; place-items:center; color:#fff; background:linear-gradient(135deg, hsl(var(--hue) 85% 68%), hsl(calc(var(--hue) + 40) 80% 60%)); box-shadow:0 5px 14px hsl(var(--hue) 80% 50% / .45); transition:transform .12s; }
  #ring .seg:active .ic { transform:scale(.92); }

  #panel { background:rgba(255,255,255,.1); border:1px solid var(--line); border-radius:20px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  #panel textarea, #panel input[type=text], #panel select { background:rgba(20,12,45,.5) !important; border:1px solid var(--line) !important; border-radius:12px; }
  #panel select option { background:#2f2256; color:#fff; }
  #panel input[type=range] { accent-color:#ff8fc0; } #panel input[type=checkbox] { accent-color:#ff8fc0; }
  #panel .chip { background:rgba(20,12,45,.45); border-radius:999px; }

  #panel button.small { background:var(--grad); border-radius:999px; font-weight:700; padding:8px 16px; }

  #login button { background:var(--grad); border:0; font-weight:700; }

  /* ================= layout 3 (Andrew's sketch, 2026-11-17 evening) ================= */

// "*waves* hey" -> segments; actions are inside asterisks, speech is everything else. Also counted as actions:
// an asterisk that never closes (her reply is still streaming, or the model forgot), and for Wizra a sentence that
// narrates her in third person without asterisks ("She crosses her arms.").
const NARR = /^\s*(she|wizra)\s+[a-z']+(s|ed)\b/i;
// A story she tells has other people in it. A line that starts with a name and a colon, then quotes or an asterisk, belongs to
// that character:   Grum: "Who goes there?"   Grum: *lowers his axe*   Those pieces carry c: the character's name.
const CAST = /^\s*([A-Z][A-Za-z'\- ]{1,22}?)\s*:\s*(?=["\u201c*])/;
function split(text, who) {
  const out = []; let cur = '';
  const piece = (text, c) => { const re = /\*([^*]+)\*|\*([^*]*)$/g; let last = 0, m;
    const say = t => {
      if (c) { if (t.trim()) out.push({ s: t, c }); return; }
      if (who !== 'her') { if (t) out.push({ s: t }); return; }
      for (const sent of t.match(/[^.!?\n]+[.!?]*["')]*\s*|\n+/g) || []) {
        if (NARR.test(sent)) out.push({ a: sent.trim() });
        else if (out.length && out[out.length - 1].s !== undefined && !out[out.length - 1].c) out[out.length - 1].s += sent; else out.push({ s: sent });
      }

    while ((m = re.exec(text))) { if (m.index > last) say(text.slice(last, m.index)); const a = (m[1] ?? m[2]).trim(); if (a) out.push(c ? { a, c } : { a }); last = re.lastIndex; }
    if (last < text.length) say(text.slice(last)); };

  for (const line of text.split(/(?<=\n)/)) { const m = CAST.exec(line), own = m && /^(wizra|she)$/i.test(m[1]); if (m && !own) { if (cur) { piece(cur, ''); cur = ''; } piece(line.slice(m[0].length), m[1].trim()); } else cur += own ? line.slice(m[0].length) : line; }
  if (cur) piece(cur, ''); return out;

const castPitch = n => [0.8, 0.86, 0.92, 1.1, 1.17, 0.83, 1.13][castHue(n) % 7];
const castHue = n => { let h = 0; for (const ch of n.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % 360; };
const castAct = (c, a) => { a = a.trim(); if (a.toLowerCase().startsWith(c.toLowerCase())) return a; const m = /^(he|she|they)\s+/i.exec(a); return c + ' ' + (m ? a.slice(m[0].length) : a.charAt(0).toLowerCase() + a.slice(1)); };

const voicedOf = text => split(text, 'her').filter(p => p.s).map(p => (p.c ? '\u27e6' + p.c + '\u27e7 ' + p.s + ' \u27e6\u27e7' : p.s)).join(' ').replace(/["“”]/g, '').replace(/[\p{Extended_Pictographic}\u200d\ufe0f\u{1f3fb}-\u{1f3ff}]/gu, ' ').replace(/\s+/g, ' ').trim();
const speechOf = (text, who) => split(text, who).filter(p => p.s).map(p => p.s).join(' ').replace(/["“”]/g, '').replace(/[\p{Extended_Pictographic}\u200d\ufe0f\u{1f3fb}-\u{1f3ff}]/gu, ' ').replace(/\s+/g, ' ').trim();   /* (her voice does not read emoji out) */

const clean = t => settings.bleep ? t.replace(CUSS, w => w[0] + '#'.repeat(Math.max(2, w.length - 1))) : t;

// An action reads as a line of its own: "he grabs the cookies", "she crosses her arms."
function actLine(who, a) {
  a = a.trim();
  if (/^(he|she|they|i|wizra|his|her|their)\b/i.test(a) || a.toLowerCase().startsWith(myName.toLowerCase())) return a;
