  /* ================= theme: twilight (2026-11-17). Warmer and brighter than the first near-black look. ================= */

  /* ================= layout 3 (Andrew's sketch, 2026-11-17 evening) ================= */

  /* the chat text never shows in the corner your portrait covers: that corner of the scroller is masked out, and the

  #log { height:100%; border:0; border-radius:0; background:none; backdrop-filter:none; -webkit-backdrop-filter:none; padding:10px 12px calc(var(--me) - var(--band) + 10px) 12px;
    --cw:calc(var(--me) + 16px); --ch:calc(var(--me) - var(--band) + 4px);
    -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - var(--ch)) no-repeat, linear-gradient(#000 0 0) bottom left / calc(100% - var(--cw)) var(--ch) no-repeat;
            mask: linear-gradient(#000 0 0) top / 100% calc(100% - var(--ch)) no-repeat, linear-gradient(#000 0 0) bottom left / calc(100% - var(--cw)) var(--ch) no-repeat; }

<body>

       text keeps clear of it), with the action wheel button on its top left corner -->

<script src="avatar.js"></script>
<script>
const $ = id => document.getElementById(id);
const log = $('log'), input = $('in'), sendBtn = $('send'), stage = $('stage');
// Touching her never shows in the chat: it goes to the server quietly and rides along with your next message.
const avatar = WizraAvatar.mount(stage, { onRenderer: () => { if (away) avatar.presence('gone'); }, onThumb: url => setHerThumb(url), onTouch: kind => { fetch('/api/touch', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind }) }).catch(() => {}); } });
let myName = 'You';

// "*waves* hey" -> segments; actions are inside asterisks, speech is everything else. Also counted as actions:
// an asterisk that never closes (her reply is still streaming, or the model forgot), and for Wizra a sentence that
// narrates her in third person without asterisks ("She crosses her arms.").
const NARR = /^\s*(she|wizra)\s+[a-z']+(s|ed)\b/i;
function split(text, who) {
  const out = []; const re = /\*([^*]+)\*|\*([^*]*)$/g; let last = 0, m;
  const say = t => {
    if (who !== 'her') { if (t) out.push({ s: t }); return; }
    for (const sent of t.match(/[^.!?\n]+[.!?]*["')]*\s*|\n+/g) || []) {
      if (NARR.test(sent)) out.push({ a: sent.trim() });
      else if (out.length && out[out.length - 1].s !== undefined) out[out.length - 1].s += sent; else out.push({ s: sent });
    }
  };
  while ((m = re.exec(text))) { if (m.index > last) say(text.slice(last, m.index)); const a = (m[1] ?? m[2]).trim(); if (a) out.push({ a }); last = re.lastIndex; }
  if (last < text.length) say(text.slice(last));
  return out;
}
const speechOf = (text, who) => split(text, who).filter(p => p.s).map(p => p.s).join(' ').replace(/["“”]/g, '').replace(/\s+/g, ' ').trim();

// Bleep filter (display only; what she actually said is kept). Covers common words and their -ing/-ed/-s forms.
const CUSS = /\b(f+u+c+k\w*|motherf\w*|sh[i1]t\w*|bullshit\w*|bitch\w*|bastard\w*|ass(hole|holes|hat|es)?|dumbass\w*|jackass\w*|damn\w*|goddamn\w*|hell|crap\w*|piss\w*|dick\w*|cock\w*|prick\w*|cunt\w*|twat\w*|wtf|stfu|lmfao)\b/gi;
let settings = { bleep: true };
const clean = t => settings.bleep ? t.replace(CUSS, w => w[0] + '#'.repeat(Math.max(2, w.length - 1))) : t;

// An action reads as a line of its own: "he grabs the cookies", "she crosses her arms."
function actLine(who, a) {
  a = a.trim();
  if (/^(he|she|they|i|wizra|his|her|their)\b/i.test(a) || a.toLowerCase().startsWith(myName.toLowerCase())) return a;
  return (who === 'her' ? 'she ' : 'he ') + a.charAt(0).toLowerCase() + a.slice(1);
}
function fill(el, text) {
  const who = el.dataset.who;
  el.textContent = '';
  for (const p of split(clean(text), who)) {
    const t = (p.a ? actLine(who, p.a) : p.s.replace(/["\u201c\u201d]/g, '')).trim(); if (!t) continue;
    const d = document.createElement('div'); d.className = p.a ? 'act' : 'say'; d.textContent = t; el.appendChild(d);
  }
}
// One message: a small round picture of who it is (a still image), what they said beside it, and each action in its own
// outlined strip underneath.
let herThumb = localStorage.getItem('brenai.thumb') || '';
function addLine(who, text) {
  const div = document.createElement('div'); div.className = 'msg ' + who;
  const pic = document.createElement('img'); pic.className = 'pic'; pic.alt = who === 'her' ? 'Wizra' : myName; pic.src = who === 'her' ? (herThumb || 'me.svg') : (meThumb || 'me.svg'); pic.dataset[who === 'her' ? 'her' : 'me'] = '1';
  const body = document.createElement('div'); body.className = 'body'; body.dataset.who = who; fill(body, text);
  div.append(pic, body); log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return body;
}
// Your own picture: tap your portrait to choose one. It is shrunk here, saved on the server, and used on every device.
let meThumb = '';
function setMeThumb(url) { meThumb = url || ''; $('meIcon').src = meThumb || 'me.svg'; for (const i of document.querySelectorAll('img[data-me]')) i.src = meThumb || 'me.svg'; }
function setHerThumb(url) { herThumb = url; try { localStorage.setItem('brenai.thumb', url); } catch {} for (const i of document.querySelectorAll('img[data-her]')) i.src = url; }
function addError(msg) { const d = document.createElement('div'); d.className = 'line err'; d.textContent = msg; log.appendChild(d); log.scrollTop = log.scrollHeight; }

// Word balloons: speech only. They stay while her reply streams, then fade; scrolling or touching one keeps it up.
const timers = {};
function hideLater(which, ms) { clearTimeout(timers[which]); timers[which] = setTimeout(() => $(which + 'Wrap').classList.remove('show'), ms); }
function bubble(which, text, keep) {
  const el = $(which + 'Bubble'), wrap = $(which + 'Wrap');
  const speech = clean(speechOf(text, which));
  clearTimeout(timers[which]);
  if (!speech) { wrap.classList.remove('show'); return; }
  el.textContent = speech; wrap.classList.add('show');
  if (keep) el.scrollTop = el.scrollHeight; else { el.scrollTop = 0; hideLater(which, 7000 + speech.length * 70); }
}
for (const w of ['her', 'me']) for (const ev of ['scroll', 'pointerdown']) $(w + 'Bubble').addEventListener(ev, () => { if ($(w + 'Wrap').classList.contains('show')) hideLater(w, 9000); }, { passive: true });

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { $('login').style.display = 'grid'; throw new Error('login'); }
  return r;
}

async function load() {
  const r = await api('/api/state'); const s = await r.json();
  myName = s.name || 'You'; if (s.settings) settings = s.settings; drawActs(); avatar.setMood(settings.mood); applyAvatar();
  log.textContent = '';
  for (const e of s.log) e.who === 'sys' ? addSys(e.text) : addLine(e.who, e.text);
  setMeThumb(s.me); plan = s.plan || null; setPresence(s.away, s.glow, true); if (s.depart === 'say') depart();
}
function addSys(text) { const d = document.createElement('div'); d.className = 'line sys'; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; }

// ---------- whether she is here ----------
// When she says she is leaving she really goes (the server decides and keeps time). While she is out the chair is empty and
// what you type waits for her. When she comes back it may show where she has really been.
let away = null, glow = null, plan = null, returning = false, toldAway = false;
function setPresence(a, g, instant) {
  const was = away; away = a || null; glow = g || null;
  $('outSign').hidden = !away;
  if (away) { $('outBack').textContent = away.back; $('outSign').title = 'Out: ' + away.where; input.placeholder = 'She is out. Leave her a message'; }
  else { input.placeholder = 'Talk or type, *actions*'; toldAway = false; }
  showPlan(plan);
  if (away && !was) avatar.presence(instant ? 'gone' : 'leave');
  avatar.setState(glow ? glow.kind : '');
}
// something she said she has later: shown quietly beside her until it happens
function showPlan(p) {
  plan = p || null; const note = $('awayNote'); note.hidden = !!away || !plan; note.classList.toggle('plan', !away && !!plan);
  if (!away && plan) $('awayText').textContent = (plan.leave ? 'Leaving' + (plan.where ? ' for ' + plan.where : '') + ' around ' + plan.leave + '.' : '') + (plan.back ? (plan.leave ? ' Back' : 'Says she will be back') + ' around ' + plan.back + '.' : '');
}
async function depart() {
  if (away || returning || sendBtn.disabled) return;
  returning = true; sendBtn.disabled = true;
  try { const r = await api('/api/depart', {}); if (r.ok) await readReply(r, null); }
  catch (e) { if (e.message !== 'login') console.error(e); }
  finally { returning = false; sendBtn.disabled = false; }
}
async function comeBack(force) {
  if (!away || returning || sendBtn.disabled) return;
  returning = true; sendBtn.disabled = true;
  try {
    const r = await api('/api/return', { force: !!force });
    if (!r.ok) return;
    await readReply(r, null, ev => { setPresence(null, ev.glow); avatar.presence('return', { sneak: !!(ev.glow && ev.glow.sneak) }); addSys('Wizra is back.'); return new Promise(ok => setTimeout(ok, 2600)); });
  } catch (e) { if (e.message !== 'login') console.error(e); }
  finally { returning = false; sendBtn.disabled = false; }
}
setInterval(async () => { // keep time with the server: is she due back, has the after-effect worn off
  if (document.hidden || $('login').style.display === 'grid') return;
  try { const r = await fetch('/api/away'); if (!r.ok) return; const d = await r.json();
    if (phoneCall.on) return;
    if (d.depart === 'say') depart(); else if (d.away && d.away.due) comeBack(false); else if (!returning && !sendBtn.disabled) { if (!away) showPlan(d.plan); if (!!d.away !== !!away) setPresence(d.away, d.glow, true); else if ((d.glow && d.glow.kind) !== (glow && glow.kind)) { glow = d.glow; avatar.setState(glow ? glow.kind : ''); } }
  } catch {}
}, 15000);

// Her reply is decided first, then typed out: nothing is rearranged after it appears. Speech starts with the typing.
function typeOut(body, text) {
  const who = body.dataset.who, segs = split(clean(text), who).map(p => ({ cls: p.a ? 'act' : 'say', t: (p.a ? actLine(who, p.a) : p.s.replace(/["“”]/g, '')).trim() })).filter(x => x.t);
  body.textContent = '';
  return new Promise(done => {
    let si = 0, ci = 0, el = null, said = ''; const total = segs.reduce((n, x) => n + x.t.length, 0), per = Math.max(1, Math.round(total / 110)); // about two seconds for a long reply, quicker for a short one
    const tick = () => {
      if (si >= segs.length) { bubble('her', text); log.scrollTop = log.scrollHeight; return done(); }
      const seg = segs[si];
      if (!el) { el = document.createElement('div'); el.className = seg.cls; body.appendChild(el); }
      ci = Math.min(seg.t.length, ci + per); el.textContent = seg.t.slice(0, ci);
      if (seg.cls === 'say') { const b = $('herBubble'); b.textContent = (said + ' ' + el.textContent).trim(); $('herWrap').classList.add('show'); b.scrollTop = b.scrollHeight; clearTimeout(timers.her); }
      if (ci >= seg.t.length) { if (seg.cls === 'say') said = (said + ' ' + seg.t).trim(); si++; ci = 0; el = null; }
      log.scrollTop = log.scrollHeight;
      setTimeout(tick, 24);
    };
    tick();
  });
}
// Reads one reply from the server (a chat answer, or what she says as she walks back in) and puts it on the screen.
async function readReply(r, body, beforeType) {
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      if (!chunk.startsWith('data: ')) continue;
      const ev = JSON.parse(chunk.slice(6));
      if (ev.t === 'away') { if (body) body.parentElement.remove(); setPresence(ev.away, null, true); if (!toldAway) { toldAway = true; addSys('She is out. She will see this when she is back.'); } return; }
      if (ev.t === 'error') throw new Error(ev.error);
      if (ev.t !== 'done') continue; // (the words arrive whole; see typeOut)
      if (beforeType) await beforeType(ev);
      if (ev.plan !== undefined && !ev.away) showPlan(ev.plan);
      if (!ev.text) { if (ev.away) { addSys('Wizra left for ' + ev.away.where + '. Back around ' + ev.away.back + '.'); plan = null; setPresence(ev.away, null, false); } return; }
      if (!body) body = addLine('her', '');
      const full = ev.text; avatar.setThinking(false); avatar.feel(full); avatar.act(full);
      const out = speechOf(full, 'her'); speaker.say(settings.bleep ? out.replace(CUSS, 'bleep') : out);
      await Promise.race([speaker.ready || Promise.resolve(), new Promise(ok => setTimeout(ok, 2200))]); // words and voice start together
      const flap = speaker.on ? null : setInterval(() => avatar.talk(), 120); // no voice: her mouth keeps time with the typing
      await typeOut(body, full); clearInterval(flap);
      if (ev.away && !ev.returned) { await new Promise(ok => setTimeout(ok, 1400)); addSys('Wizra left for ' + ev.away.where + '. Back around ' + ev.away.back + '.'); plan = null; setPresence(ev.away, null, false); }
      else if (ev.glow !== undefined && !ev.returned) { glow = ev.glow; avatar.setState(glow ? glow.kind : ''); }
    }
  }
}

async function send(quick) {
  const text = (typeof quick === 'string' ? quick : input.value).trim(); if (!text) return;
  if (phoneCall.on) { input.value = ''; voice.reset(); return callSay(text); }               // on a call your words go to the call, not the chat
  if (sendBtn.disabled) { if (typeof quick !== 'string') voice.pending = true; return; } // she is still answering: send this right after
  if (typeof quick !== 'string') { voice.reset(); input.value = ''; autosize(); }
  sendBtn.disabled = true; speaker.stop(); if (!away) { avatar.setThinking(true); userDid(text); }
  addLine('me', text); bubble('me', text);
  let body = null; if (!away) { body = addLine('her', ''); body.innerHTML = '<span class="typing">typing...</span>'; }
  try {
    const r = await api('/api/chat', { text, doing: avatar.activity(), voice: speaker.on && speaker.engine() === 'pc' });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || ('HTTP ' + r.status)); }
    await readReply(r, body);
  } catch (e) {
    if (e.message !== 'login') { if (body && body.parentElement && body.parentElement.isConnected) body.parentElement.remove(); addError(e.message); }
  } finally {
    sendBtn.disabled = false; avatar.setThinking(false);
    if (!matchMedia('(pointer:coarse)').matches && !voice.on) input.focus();
    if (voice.pending) { voice.pending = false; send(); }
  }
}

// Action buttons: things you do; she reacts. (Later these can also drive the avatar directly.)
// Which picture she uses: the cartoon, or the uploaded 3D model. Swaps live; the cartoon stays up until the model is ready.
let avatarShown = 'puppet', avatarNote = '';
async function applyAvatar() {
  const want = settings.avatarKind === 'vrm' && settings.avatarV ? 'vrm:' + settings.avatarV : 'puppet';
  if (want === avatarShown) return; avatarShown = want; avatarNote = '';
  if (want === 'puppet') return avatar.setRenderer(null);
  try {
    const m = await import('./avatar-vrm.js'); const r = await m.create('/api/avatar?v=' + settings.avatarV);
    if (avatarShown === want) avatar.setRenderer(r); else r.dispose();
  } catch (e) { console.error(e); if (avatarShown === want) { avatarShown = 'puppet'; avatarNote = 'The 3D model could not be shown on this device (' + e.message + '). Showing the cartoon.'; avatar.setRenderer(null); } }
}

const ACT_ICONS = [[/wave|hello|\bhi\b/i, '\ud83d\udc4b'], [/poke|prod|jab/i, '\ud83d\udc49'], [/high five/i, '\ud83d\ude4c'], [/laugh|giggle|grin/i, '\ud83d\ude04'], [/nod/i, '\ud83d\ude42'], [/stare|glare|look/i, '\ud83d\udc40'],
  [/snack|cookie|food|pizza/i, '\ud83c\udf6a'], [/shrug/i, '\ud83e\udd37'], [/hug/i, '\ud83e\udd17'], [/coffee|drink|tea/i, '\u2615'], [/pat|pet|ruffle/i, '\ud83e\udef3'], [/kiss/i, '\ud83d\ude18'], [/dice|roll/i, '\ud83c\udfb2'], [/clap/i, '\ud83d\udc4f'], [/wink/i, '\ud83d\ude09'], [/gift|hand|give/i, '\ud83c\udf81']];
const iconFor = (name, act, icon) => icon || (ACT_ICONS.find(([re]) => re.test(name + ' ' + act)) || [0, '\u2728'])[1];
function drawActs() {
  const fan = $('actFan'); fan.textContent = '';
  const items = (settings.acts || []).map(([name, act, icon]) => ({ icon: iconFor(name, act, icon), name, go: () => send('*' + act + '*') }));
  items.push({ icon: '\u270e', name: 'Edit', go: () => openWheel().then(() => openPanel('acts')).catch(() => {}) });
  // rings of a quarter circle, opening up and to the left of the button

  for (const [count, r] of rings) {

    here.forEach((it, k) => {
      const ang = (174 + (here.length === 1 ? 48 : k * 100 / (here.length - 1))) * Math.PI / 180;

      b.style.setProperty('--hue', (318 + (hue++) * 37) % 360); if (it.name === 'Edit') b.classList.add('plain');

      const ic = document.createElement('span'); ic.textContent = it.icon; const lb = document.createElement('small'); lb.textContent = it.name;

}

// Things you do to her in the chat (typed or from the action buttons) also land on the avatar straight away.
const DID = [[/\bpoke|\bprod|\bjab/i, 'poke'], [/\bboop/i, 'boop'], [/\bpat|\bpet\b|ruffl|\bhug|head ?pat/i, 'pat'], [/\bswat|\bsmack|\bbonk|\bflick/i, 'swat'], [/\bwave|high five/i, 'wave'], [/\blaugh|\bgrin|\bsmile/i, 'laugh'], [/\bstare|\bglare/i, 'stare'], [/\bhand(s)? her|\bgive(s)? her|\bslide(s)? .* to her|\boffer/i, 'gift']];

// ---------- voice input (talk to text) ----------
// The browser's own speech recognition (Chrome, Edge, Safari; not Firefox). On by default; remembered per device.
// It keeps listening; once you stop talking for `wait` seconds, what it heard is sent to Wizra.
const voice = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const saved = JSON.parse(localStorage.getItem('brenai.voice') || '{}');
  const v = { supported: !!SR, on: SR ? saved.on !== false : false, wait: saved.wait || 2.5, pending: false };
  let rec = null, running = false, prefix = '', heard = '', interim = '', timer = null, barT = null, gestureHook = false;
  const mic = $('mic'), bar = $('heardBar');
  const store = () => localStorage.setItem('brenai.voice', JSON.stringify({ on: v.on, wait: v.wait }));
  const show = () => { mic.hidden = !SR; mic.classList.toggle('on', v.on); mic.classList.toggle('hearing', v.on && running); };
  const write = () => { input.value = (prefix + ' ' + heard + ' ' + interim).replace(/\s+/g, ' ').trim(); autosize(); };
  function countdown() {
    clearTimeout(timer); cancelAnimationFrame(barT);
    if (!(heard + interim).trim()) { bar.style.transform = 'scaleX(0)'; return; }
    const t0 = performance.now(), ms = v.wait * 1000;
    const tick = () => { const f = Math.min(1, (performance.now() - t0) / ms); bar.style.transform = `scaleX(${f})`; if (f < 1) barT = requestAnimationFrame(tick); };
    tick();
    timer = setTimeout(() => { heard = (heard + ' ' + interim).trim(); interim = ''; write(); send(); }, ms);
  }
  function start() {
    if (!SR || !v.on || running || held) return;
    rec = new SR(); rec.lang = navigator.language || 'en-US'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = e => {
      if (held) return;                       // that is her voice coming out of the speaker, not you
      if (speaker.speaking) speaker.stop();   // headphones mode: talking over her cuts her off
      interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) heard += ' ' + t; else interim += t;
      }
      write(); countdown();
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        // no permission yet (or the browser wants a tap first): try again on the next tap
        if (!gestureHook) { gestureHook = true; addEventListener('pointerdown', () => { gestureHook = false; start(); }, { once: true }); }
      }
    };
    rec.onend = () => { running = false; show(); if (v.on && !document.hidden) setTimeout(start, 400); };
    try { rec.start(); running = true; } catch { running = false; }
    show();
  }
  function stop() { clearTimeout(timer); try { rec && rec.stop(); } catch {} running = false; show(); }
  // while she is speaking out loud the mic is held, so it does not hear her and answer for you
  let held = false;
  v.hold = b => { held = b; if (b) { try { rec && rec.stop(); } catch {} } else setTimeout(start, 350); };
  v.set = (patch) => { Object.assign(v, patch); store(); if (v.on) start(); else stop(); show(); };
  v.reset = () => { clearTimeout(timer); cancelAnimationFrame(barT); bar.style.transform = 'scaleX(0)'; prefix = heard = interim = ''; };
  // typing by hand takes over: no auto-send of what you are typing; speech after it is added on
  v.typed = e => { if (e.key === 'Enter') return; clearTimeout(timer); cancelAnimationFrame(barT); bar.style.transform = 'scaleX(0)'; setTimeout(() => { prefix = input.value; heard = interim = ''; }, 0); };
  mic.onclick = () => { if (speaker.speaking) return speaker.stop(); v.set({ on: !v.on }); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
  v.start = start;
  show();
  return v;
})();

// ---------- her voice (text to speech) ----------
// The browser's built-in voices. She says only her spoken words, never the actions. Settings are per device because every
// device has different voices. The mic is held while she talks unless "headphones" is on, where talking over her stops her.
const speaker = (() => {
  const SS = window.speechSynthesis, saved = JSON.parse(localStorage.getItem('brenai.speak') || '{}');

  v.on = saved.on !== false;

  const store = () => localStorage.setItem('brenai.speak', JSON.stringify({ on: v.on, voice: v.voice, rate: v.rate, pitch: v.pitch, headphones: v.headphones, engine: v.device ? 'device' : 'pc' }));
  v.voices = () => (v.supported ? SS.getVoices() : []).filter(x => /^en/i.test(x.lang));
  const pick = () => { const all = v.voices(); return all.find(x => x.name === v.voice) || all.find(x => /Aria|Jenny|Samantha|Ava|Google US English|Zira|female/i.test(x.name)) || all[0] || null; };
  const end = () => { v.speaking = false; clearInterval(tick); voice.hold(false); };
  // Two engines: her Kokoro voice on the PC (same voice on every device), or this device's own voices as the fallback.
  v.device = saved.engine === 'device';
  v.engine = () => (!v.device && brainInfo.tts) ? 'pc' : 'device';
  const player = new Audio(); let gen = 0;
  // how her words are cut into clips (the server cuts them the same way, to have them ready)
  function speechChunks(text) {
    // dots used as a pause ("well.. what do you think?") become a comma: one flowing line with a short breath, not two clips
    const t = String(text).replace(/\s*(?:\.{2,}|\u2026)+\s*/g, ', ').replace(/\s*[\u2014\u2013]\s*|\s+-\s+/g, ', ').replace(/,(\s*,)+/g, ',').replace(/,\s*([.!?])/g, '$1').replace(/^[,\s]+|[,\s]+$/g, '');
    const parts = (t.match(/[^.!?\n]+[.!?]*["')]*\s*/g) || []).map(x => x.trim()).filter(Boolean);
    const out = []; for (const p of parts) { if (out.length && out[out.length - 1].length < 55) out[out.length - 1] += ' ' + p; else out.push(p); } // short sentences ride together, so there is no gap between them
    return out;
  }

  function deviceSay(parts) {
    if (!v.supported) return;
    for (const part of parts) { // one sentence per utterance: some browsers cut a long one off
      const u = new SpeechSynthesisUtterance(part); const vc = pick(); if (vc) u.voice = vc; u.lang = vc ? vc.lang : 'en-US'; u.rate = v.rate; u.pitch = v.pitch;
      pending++; u.onstart = begin; u.onend = u.onerror = () => { if (--pending <= 0) { pending = 0; end(); } };
      SS.speak(u);
    }
  }
  // Her mouth follows her actual voice: the clip is a plain 16-bit WAV, so its loudness over time is read straight from it
  // (one value per 40 ms) and looked up by the playback position.
  async function envelope(blob) {
    try {
      const d = new DataView(await blob.arrayBuffer()); if (d.getUint16(34, true) !== 16) return null;
      const rate = d.getUint32(24, true), win = Math.round(rate * 0.04), n = Math.floor((d.byteLength - 44) / 2), out = [];
      let peak = 0.02;
      for (let i = 0; i + win <= n; i += win) { let sum = 0; for (let j = 0; j < win; j += 4) { const x = d.getInt16(44 + (i + j) * 2, true) / 32768; sum += x * x; } const r = Math.sqrt(sum / (win / 4)); out.push(r); if (r > peak) peak = r; }
      return out.map(x => Math.min(1, x / (peak * 0.7)));
    } catch { return null; }
  }
  let env = null;
  const begin = () => { if (v.speaking) return; v.speaking = true; if (!v.headphones) voice.hold(true); clearInterval(tick); tick = setInterval(() => { const lvl = env && !player.paused ? env[Math.floor(player.currentTime / 0.04)] : undefined; avatar.talk(lvl); }, 40); };
  const playBlob = blob => new Promise(async done => {
    env = await envelope(blob);
    const url = URL.createObjectURL(blob); player.src = url; player.playbackRate = v.rate;
    player.onplaying = () => { begin(); if (v.onFirst) v.onFirst(); }; player.onended = player.onerror = () => { URL.revokeObjectURL(url); env = null; done(); };
    player.play().catch(() => done());

    if (!v.on || !text) return;
    const parts = sentences(text), my = ++gen;
    if (v.engine() !== 'pc') { v.ready = Promise.resolve(); return deviceSay(parts); }
    v.waiting = true;                                           // her PC voice is being made: she is about to speak
    let go; v.ready = new Promise(ok => { go = ok; }); setTimeout(() => go(), 6000);
    v.onFirst = go;
    // ask for every line at once (the PC makes them in order), play them back to back
    const clips = parts.map(line => fetch('/api/tts', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: line }) }).then(r => r.ok ? r.blob() : null).catch(() => null));

    const rate = el('input', { type: 'range', min: 0.7, max: 1.5, step: 0.05, value: speaker.rate }); rate.onchange = () => speaker.set({ rate: +rate.value });
    const pitch = el('input', { type: 'range', min: 0.6, max: 1.6, step: 0.05, value: speaker.pitch }); pitch.onchange = () => speaker.set({ pitch: +pitch.value });
    const hp = el('input', { type: 'checkbox', checked: speaker.headphones }); hp.onchange = () => speaker.set({ headphones: hp.checked });
    const sample = el('input', { type: 'text', value: localStorage.getItem('brenai.sample') || 'Okay, this is what I sound like. Good enough?', placeholder: 'Type something for her to say', maxLength: 300 });
    const test = el('button', { className: 'small', textContent: '\u25b6 Say it' }); test.onclick = () => { const line = sample.value.trim() || 'Okay, this is what I sound like. Good enough?'; localStorage.setItem('brenai.sample', line); speaker.stop(); const was = speaker.on; speaker.on = true; speaker.say(line); speaker.on = was; };
    sample.addEventListener('keydown', e => { if (e.key === 'Enter') test.click(); });
    p.append(el('label', {}, son, ' She speaks her replies out loud'));
    if (brainInfo.tts) p.append(el('label', { textContent: 'Her voice' }), ksel, el('label', {}, dev, ' Use this device\'s voice instead'));
    if (!pc) p.append(el('label', { textContent: 'Device voice' }), sel, el('div', { className: 'note', textContent: 'Android and some phones ignore this choice and use the phone\'s own voice (Android: Settings > Accessibility > Text-to-speech output). Her PC voice is the way to pick a voice on a phone.' }));
    p.append(
      el('label', { textContent: 'Speed' }), rate, el('div', { className: 'scale' }, el('span', { textContent: 'slow' }), el('span', { textContent: 'fast' })),
      ...(pc ? [] : [el('label', { textContent: 'Pitch' }), pitch, el('div', { className: 'scale' }, el('span', { textContent: 'low' }), el('span', { textContent: 'high' }))]),
      el('label', {}, hp, ' I am on headphones (keep listening while she talks; talking over her cuts her off)'),
      el('label', { textContent: 'Try her voice' }), el('div', { className: 'row' }, sample, test),
      el('div', { className: 'note', textContent: 'Sending a message or tapping the mic button stops her mid-sentence.' }));
  } else if (k === 'secret') {
    p.append(el('h3', { textContent: 'Hidden likes' }), el('div', { className: 'note', textContent: 'Dashed = still secret, filled = she has told you. Tap one to flip it. She can grow new ones from good moments; those say (grew). She only admits a secret once she trusts you enough.' }), listEditor('', 'hiddenLikes', true));
  }
}
async function openWheel() {

}
function closeWheel() { $('wheel').classList.remove('open'); }

let brainInfo = {};

  } catch {}
}
