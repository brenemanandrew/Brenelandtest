<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Brenai</title>
<style>
  :root { --bg:#0f0c14; --panel:#1a1522; --line:#2e2638; --her:#2c2140; --me:#1f3346; --text:#e9e4f0; --dim:#9b92a8; --act:#b8a6d9; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  #app { height:100dvh; display:grid; grid-template-rows: auto 1fr auto; gap:10px; padding:10px; max-width:900px; margin:0 auto; }

  /* top: her picture (top left) + her chat window */
  #top { display:grid; grid-template-columns: 96px 1fr; gap:10px; min-height:0; grid-row: 1 / 3; }
  .who { position:relative; display:flex; flex-direction:column; align-items:center; }
  .who img { width:96px; height:96px; border-radius:14px; border:2px solid var(--line); object-fit:cover; background:#000; }
  .who .name { font-size:13px; color:var(--dim); margin-top:4px; }
  #herCol { padding-top:84px; } /* room for her bubble above her head */

  #log { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 12px; overflow-y:auto; min-height:0; }
  .line { margin:6px 0; white-space:pre-wrap; word-wrap:break-word; }
  .line b { font-weight:600; }
  .line.her b { color:#d4b8ff; }
  .line.me b { color:#9fd0ff; }
  .line .act { color:var(--act); font-style:italic; }
  .line.err { color:#ff9a9a; font-size:14px; }
  .typing { color:var(--dim); font-style:italic; }

  /* speech bubbles above heads */
  .bubble { position:absolute; left:0; bottom:calc(100% + 10px); width:max-content; max-width:min(70vw, 420px);
            padding:8px 12px; border-radius:14px; font-size:15px; line-height:1.3; z-index:5;
            display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
            opacity:0; transform:translateY(6px); transition:opacity .25s, transform .25s; pointer-events:none; }
  .bubble.show { opacity:1; transform:none; }
  .bubble::after { content:""; position:absolute; left:36px; top:100%; border:8px solid transparent; }
  #herBubble { background:var(--her); border:1px solid #4a3a66; bottom:auto; top:0; }
  #herBubble::after { display:none; }
  #herTail { position:absolute; left:40px; top:72px; border:8px solid transparent; border-top-color:#4a3a66; opacity:0; transition:opacity .25s; }
  #herTail.show { opacity:1; }
  #meBubble { background:var(--me); border:1px solid #33506b; }
  #meBubble::after { border-top-color:#33506b; }

  /* bottom: me + input */
  #bottom { display:grid; grid-template-columns: 64px 1fr auto auto; gap:8px; align-items:end; grid-row:3; }
  #meCol img { width:64px; height:64px; }
  #meCol .bubble { left:0; }
  #in { width:100%; resize:none; max-height:30vh; min-height:46px; padding:12px; border-radius:12px; border:1px solid var(--line);
        background:var(--panel); color:var(--text); font:inherit; }
  #send { height:46px; padding:0 16px; border-radius:12px; border:0; background:#6b4fa3; color:#fff; font:inherit; font-weight:600; }
  #send:disabled { opacity:.5; }
  #mic { height:46px; width:46px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--dim); font-size:20px; padding:0; }
  #mic.on { color:#fff; background:#7a2e4a; border-color:#b04a72; }
  #mic.on.hearing { animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(176,74,114,.6); } 50% { box-shadow:0 0 0 8px rgba(176,74,114,0); } }
  #mic[hidden] { display:none; }
  #heardBar { position:absolute; left:0; right:0; bottom:100%; height:3px; background:#b04a72; transform-origin:left; transform:scaleX(0); }
  #inWrap { position:relative; }
  #menu { position:fixed; top:10px; right:12px; background:none; border:0; color:var(--dim); font-size:20px; }

  #herCol img { cursor:pointer; }
  /* settings wheel */
  #wheel { position:fixed; inset:0; background:rgba(8,6,12,.82); display:none; z-index:15; overflow-y:auto; }
  #wheel.open { display:block; }
  #ring { position:relative; width:280px; height:280px; margin:24px auto 8px; }
  #ring .hub { position:absolute; left:90px; top:90px; width:100px; height:100px; border-radius:50%; overflow:hidden; border:2px solid #4a3a66; cursor:pointer; }
  #ring .hub img { width:100%; height:100%; }
  #ring .seg { position:absolute; width:76px; height:76px; margin:-38px 0 0 -38px; border-radius:50%; border:1px solid #4a3a66; background:#221a2e;
               color:var(--text); font:600 12px/1.15 system-ui, sans-serif; display:grid; place-items:center; text-align:center; padding:4px; cursor:pointer; }
  #ring .seg.on { background:#4b3672; }
  #ring .seg small { display:block; font-weight:400; color:var(--dim); font-size:11px; }
  #panel { max-width:520px; margin:0 auto 30px; padding:14px; background:var(--panel); border:1px solid var(--line); border-radius:14px; display:none; }
  #panel.show { display:block; }
  #panel h3 { margin:0 0 10px; font-size:16px; }
  #panel label { display:block; margin:10px 0 4px; color:var(--dim); font-size:13px; }
  #panel input[type=range] { width:100%; }
  #panel textarea, #panel input[type=text] { width:100%; background:#120e18; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; font-size:14px; }
  #panel .chips { display:flex; flex-wrap:wrap; gap:6px; }
  #panel .chip { padding:6px 10px; border-radius:16px; border:1px solid var(--line); background:#120e18; color:var(--text); font-size:14px; }
  #panel .chip.sel { background:#4b3672; border-color:#6b4fa3; }
  #panel .chip.secret { border-style:dashed; }
  #panel .chip .x { margin-left:6px; color:var(--dim); cursor:pointer; }
  #panel .row { display:flex; gap:8px; margin-top:6px; }
  #panel .row input { flex:1; }
  #panel button.small { padding:6px 12px; border-radius:8px; border:0; background:#6b4fa3; color:#fff; font:inherit; font-size:14px; }
  #panel .scale { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); }
  #panel .note { font-size:12px; color:var(--dim); margin-top:6px; }
  #closeWheel { position:fixed; top:10px; right:14px; font-size:26px; background:none; border:0; color:var(--text); z-index:16; }
  #login { position:fixed; inset:0; background:var(--bg); display:none; place-items:center; z-index:20; }
  #login form { display:grid; gap:10px; width:260px; }
  #login input, #login button { padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="who" id="herCol">
      <div class="bubble" id="herBubble"></div>
      <div id="herTail"></div>
      <img src="wizra.svg" alt="Wizra">
      <div class="name">Wizra</div><div class="name" id="brainDot" title="Her brain: the model on your PC">...</div>
    </div>
    <div id="log"></div>
  </div>
  <div id="bottom">
    <div class="who" id="meCol">
      <div class="bubble" id="meBubble"></div>
      <img src="me.svg" alt="You">
      <div class="name" id="meName">You</div>
    </div>
    <div id="inWrap"><div id="heardBar"></div><textarea id="in" rows="1" placeholder="Talk, or type. *Asterisks* for actions."></textarea></div>
    <button id="mic" title="Voice input (tap to turn on or off)" hidden>&#127908;</button>
    <button id="send">Send</button>
  </div>
</div>
<button id="menu" title="New conversation">&#8635;</button>
<div id="wheel"><button id="closeWheel" title="Close">&times;</button><div id="ring"></div><div id="panel"></div></div>
<div id="login"><form id="loginForm"><div>Password</div><input id="pw" type="password" autocomplete="current-password"><button>Enter</button></form></div>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), input = $('in'), sendBtn = $('send');
let myName = 'You';

// "*waves* hey" -> segments; actions are inside asterisks, speech is everything else
function split(text) {
  const out = []; const re = /\*([^*]+)\*/g; let last = 0, m;
  while ((m = re.exec(text))) { if (m.index > last) out.push({ s: text.slice(last, m.index) }); out.push({ a: m[1] }); last = re.lastIndex; }
  if (last < text.length) out.push({ s: text.slice(last) });
  return out;
}
const speechOf = text => split(text).filter(p => p.s).map(p => p.s).join(' ').replace(/\s+/g, ' ').trim();

// Bleep filter (display only; what she actually said is kept). Covers common words and their -ing/-ed/-s forms.
const CUSS = /\b(f+u+c+k\w*|motherf\w*|sh[i1]t\w*|bullshit\w*|bitch\w*|bastard\w*|ass(hole|holes|hat|es)?|dumbass\w*|jackass\w*|damn\w*|goddamn\w*|hell|crap\w*|piss\w*|dick\w*|cock\w*|prick\w*|cunt\w*|twat\w*|wtf|stfu|lmfao)\b/gi;
let settings = { bleep: true };
const clean = t => settings.bleep ? t.replace(CUSS, w => w[0] + '#'.repeat(Math.max(2, w.length - 1))) : t;

function fill(el, text) {
  text = clean(text);
  el.textContent = '';
  for (const p of split(text)) {
    const span = document.createElement('span');
    if (p.a) { span.className = 'act'; span.textContent = '*' + p.a + '*'; } else span.textContent = p.s;
    el.appendChild(span);
  }
}
function addLine(who, text) {
  const div = document.createElement('div');
  div.className = 'line ' + who;
  const b = document.createElement('b'); b.textContent = (who === 'her' ? 'Wizra' : myName) + ': ';
  const body = document.createElement('span'); fill(body, text);
  div.append(b, body); log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return body;
}
function addError(msg) { const d = document.createElement('div'); d.className = 'line err'; d.textContent = msg; log.appendChild(d); log.scrollTop = log.scrollHeight; }

const timers = {};
function bubble(which, text, keep) {
  const el = $(which + 'Bubble'), tail = which === 'her' ? $('herTail') : null;
  const speech = clean(speechOf(text));
  clearTimeout(timers[which]);
  if (!speech) { el.classList.remove('show'); tail && tail.classList.remove('show'); return; }
  el.textContent = speech; el.classList.add('show'); tail && tail.classList.add('show');
  if (!keep) timers[which] = setTimeout(() => { el.classList.remove('show'); tail && tail.classList.remove('show'); }, 6000 + speech.length * 60);
}

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { $('login').style.display = 'grid'; throw new Error('login'); }
  return r;
}

async function load() {
  const r = await api('/api/state'); const s = await r.json();
  myName = s.name || 'You'; $('meName').textContent = myName; if (s.settings) settings = s.settings;
  log.textContent = '';
  for (const e of s.log) addLine(e.who, e.text);
}

async function send() {
  const text = input.value.trim(); if (!text) return;
  if (sendBtn.disabled) { voice.pending = true; return; } // she is still answering: send this right after
  voice.reset();
  input.value = ''; autosize(); sendBtn.disabled = true;
  addLine('me', text); bubble('me', text);
  const body = addLine('her', ''); body.innerHTML = '<span class="typing">typing...</span>';
  let full = '';
  try {
    const r = await api('/api/chat', { text });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || ('HTTP ' + r.status)); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!chunk.startsWith('data: ')) continue;
        const ev = JSON.parse(chunk.slice(6));
        if (ev.t === 'delta') { full += ev.d; fill(body, full); bubble('her', full, true); log.scrollTop = log.scrollHeight; }
        else if (ev.t === 'done') { full = ev.text; fill(body, full); bubble('her', full); }
        else if (ev.t === 'error') throw new Error(ev.error);
      }
    }
  } catch (e) {
    if (e.message !== 'login') { body.parentElement.remove(); addError(e.message); }
  } finally {
    sendBtn.disabled = false;
    if (!matchMedia('(pointer:coarse)').matches && !voice.on) input.focus();
    if (voice.pending) { voice.pending = false; send(); }
  }
}

function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, innerHeight * 0.3) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => voice.typed(e));
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer:coarse)').matches) { e.preventDefault(); send(); } });
sendBtn.onclick = send;
$('menu').onclick = async () => { if (confirm('Start a new conversation? She keeps what she has learned about you.')) { await api('/api/reset', {}); load(); } };
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) });
  if (r.ok) { $('login').style.display = 'none'; load(); voice.start(); } else $('pw').value = '';
};
// ---------- voice input (talk to text) ----------
// The browser's own speech recognition (Chrome, Edge, Safari; not Firefox). On by default; remembered per device.
// It keeps listening; once you stop talking for `wait` seconds, what it heard is sent to Wizra.
const voice = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const saved = JSON.parse(localStorage.getItem('brenai.voice') || '{}');
  const v = { supported: !!SR, on: SR ? saved.on !== false : false, wait: saved.wait || 2.5, pending: false };
  let rec = null, running = false, prefix = '', heard = '', interim = '', timer = null, barT = null, gestureHook = false;
  const mic = $('mic'), bar = $('heardBar');
  const store = () => localStorage.setItem('brenai.voice', JSON.stringify({ on: v.on, wait: v.wait }));
  const show = () => { mic.hidden = !SR; mic.classList.toggle('on', v.on); mic.classList.toggle('hearing', v.on && running); };
  const write = () => { input.value = (prefix + ' ' + heard + ' ' + interim).replace(/\s+/g, ' ').trim(); autosize(); };
  function countdown() {
    clearTimeout(timer); cancelAnimationFrame(barT);
    if (!(heard + interim).trim()) { bar.style.transform = 'scaleX(0)'; return; }
    const t0 = performance.now(), ms = v.wait * 1000;
    const tick = () => { const f = Math.min(1, (performance.now() - t0) / ms); bar.style.transform = `scaleX(${f})`; if (f < 1) barT = requestAnimationFrame(tick); };
    tick();
    timer = setTimeout(() => { heard = (heard + ' ' + interim).trim(); interim = ''; write(); send(); }, ms);
  }
  function start() {
    if (!SR || !v.on || running) return;
    rec = new SR(); rec.lang = navigator.language || 'en-US'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = e => {
      interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) heard += ' ' + t; else interim += t;
      }
      write(); countdown();
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        // no permission yet (or the browser wants a tap first): try again on the next tap
        if (!gestureHook) { gestureHook = true; addEventListener('pointerdown', () => { gestureHook = false; start(); }, { once: true }); }
      }
    };
    rec.onend = () => { running = false; show(); if (v.on && !document.hidden) setTimeout(start, 400); };
    try { rec.start(); running = true; } catch { running = false; }
    show();
  }
  function stop() { clearTimeout(timer); try { rec && rec.stop(); } catch {} running = false; show(); }
  v.set = (patch) => { Object.assign(v, patch); store(); if (v.on) start(); else stop(); show(); };
  v.reset = () => { clearTimeout(timer); cancelAnimationFrame(barT); bar.style.transform = 'scaleX(0)'; prefix = heard = interim = ''; };
  // typing by hand takes over: no auto-send of what you are typing; speech after it is added on
  v.typed = e => { if (e.key === 'Enter') return; clearTimeout(timer); cancelAnimationFrame(barT); bar.style.transform = 'scaleX(0)'; setTimeout(() => { prefix = input.value; heard = interim = ''; }, 0); };
  mic.onclick = () => v.set({ on: !v.on });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
  v.start = start;
  show();
  return v;
})();

// ---------- the wheel ----------
let sheet = null;
const MOODS = ['auto', 'happy', 'playful', 'chill', 'focused', 'excited', 'tired', 'grumpy', 'sad', 'anxious'];
const LABEL = v => v < 20 ? 'very low' : v < 40 ? 'low' : v < 60 ? 'middle' : v < 80 ? 'high' : 'very high';
async function saveSettings(patch) {
  const r = await api('/api/settings', patch); const d = await r.json();
  settings = d.settings; sheet = d.sheet; drawRing(); redrawLog();
}
function redrawLog() { load().catch(() => {}); }
function el(tag, props = {}, ...kids) { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids); return e; }

const SEGS = [
  { k: 'mood', name: 'Emotion', sub: () => settings.mood },
  { k: 'react', name: 'Reactions', sub: () => LABEL(settings.expressiveness) },
  { k: 'temp', name: 'Temperature', sub: () => LABEL(settings.temperature) },
  { k: 'sfw', name: 'SFW', sub: () => settings.sfw ? 'on' : 'off', toggle: 'sfw' },
  { k: 'bleep', name: 'Bleep', sub: () => settings.bleep ? 'on' : 'off', toggle: 'bleep' },
  { k: 'sheet', name: 'Character', sub: () => sheet ? 'rapport ' + sheet.rapport : '' },
  { k: 'secret', name: 'Hidden likes', sub: () => sheet ? sheet.hiddenLikes.length + '' : '' },
  { k: 'voice', name: 'Talk to text', sub: () => !voice.supported ? 'n/a' : voice.on ? voice.wait + 's' : 'off' },
];
function drawRing() {
  const ring = $('ring'); ring.textContent = '';
  const hub = el('div', { className: 'hub', onclick: closeWheel }); hub.append(el('img', { src: 'wizra.svg', alt: 'Wizra' })); ring.append(hub);
  SEGS.forEach((g, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / SEGS.length;
    const b = el('div', { className: 'seg' + (g.toggle && settings[g.toggle] ? ' on' : '') });
    b.style.left = (140 + 105 * Math.cos(a)) + 'px'; b.style.top = (140 + 105 * Math.sin(a)) + 'px';
    b.append(g.name, el('small', { textContent: g.sub() }));
    b.onclick = () => g.toggle ? saveSettings({ settings: { [g.toggle]: !settings[g.toggle] } }) : openPanel(g.k);
    ring.append(b);
  });
}
function slider(title, key, lo, hi, note) {
  const out = el('div');
  const r = el('input', { type: 'range', min: 0, max: 100, value: settings[key] });
  r.onchange = () => saveSettings({ settings: { [key]: +r.value } });
  out.append(el('h3', { textContent: title }), r, el('div', { className: 'scale' }, el('span', { textContent: lo }), el('span', { textContent: hi })));
  if (note) out.append(el('div', { className: 'note', textContent: note }));
  return out;
}
function listEditor(title, key, secret) {
  const box = el('div'); box.append(el('label', { textContent: title }));
  const chips = el('div', { className: 'chips' });
  const items = sheet[key];
  items.forEach((it, i) => {
    const text = secret ? it.text : it;
    const c = el('span', { className: 'chip' + (secret ? (it.revealed ? ' sel' : ' secret') : ''), textContent: text + (secret && it.grown ? ' (grew)' : '') });
    if (secret) { c.title = it.revealed ? 'She has told you. Tap to make it secret again.' : 'Still secret. Tap to mark revealed.'; c.onclick = () => { items[i].revealed = !items[i].revealed; saveSettings({ sheet: { [key]: items } }).then(() => openPanel(cur)); }; }
    const x = el('span', { className: 'x', textContent: '×' });
    x.onclick = ev => { ev.stopPropagation(); items.splice(i, 1); saveSettings({ sheet: { [key]: items } }).then(() => openPanel(cur)); };
    c.append(x); chips.append(c);
  });
  const inp = el('input', { type: 'text', placeholder: 'add one' });
  const add = el('button', { className: 'small', textContent: 'Add' });
  add.onclick = () => { const v = inp.value.trim(); if (!v) return; items.push(secret ? { text: v, revealed: false } : v); saveSettings({ sheet: { [key]: items } }).then(() => openPanel(cur)); };
  box.append(chips, el('div', { className: 'row' }, inp, add));
  return box;
}
let cur = null;
function openPanel(k) {
  cur = k; const p = $('panel'); p.textContent = ''; p.classList.add('show');
  if (k === 'mood') {
    p.append(el('h3', { textContent: 'Emotion' }));
    const chips = el('div', { className: 'chips' });
    for (const m of MOODS) { const c = el('span', { className: 'chip' + (settings.mood === m ? ' sel' : ''), textContent: m }); c.onclick = () => saveSettings({ settings: { mood: m } }).then(() => openPanel('mood')); chips.append(c); }
    p.append(chips, el('div', { className: 'note', textContent: 'auto lets her mood follow the conversation.' }));
  } else if (k === 'react') {
    p.append(slider('How she reacts', 'expressiveness', 'reserved, dry', 'big, dramatic'));
  } else if (k === 'temp') {
    p.append(slider('Temperature', 'temperature', 'predictable', 'wild', 'Real sampling temperature on your PC model (0.3 to 1.2, middle is 0.75), plus a matching hint in her instructions. Lower if she rambles or gets odd.'));
  } else if (k === 'sheet') {
    p.append(el('h3', { textContent: 'Character' }));
    const bd = el('input', { type: 'text', value: sheet.birthday });
    const bs = el('textarea', { rows: 6, value: sheet.backstory });
    const saveTxt = el('button', { className: 'small', textContent: 'Save birthday + backstory' });
    saveTxt.onclick = () => saveSettings({ sheet: { birthday: bd.value, backstory: bs.value } }).then(() => openPanel('sheet'));
    const rp = el('input', { type: 'range', min: 0, max: 100, value: sheet.rapport }); rp.onchange = () => saveSettings({ sheet: { rapport: +rp.value } }).then(() => openPanel('sheet'));
    const cl = el('input', { type: 'range', min: 0, max: 3, step: 1, value: sheet.cussLevel }); cl.onchange = () => saveSettings({ sheet: { cussLevel: +cl.value } }).then(() => openPanel('sheet'));
    const dev = el('input', { type: 'checkbox', checked: settings.cussDevelop }); dev.onchange = () => saveSettings({ settings: { cussDevelop: dev.checked } });
    p.append(el('label', { textContent: 'Birthday' }), bd, el('label', { textContent: 'Backstory' }), bs, el('div', { className: 'row' }, saveTxt),
      listEditor('Likes', 'likes'), listEditor('Dislikes', 'dislikes'),
      el('label', { textContent: 'Rapport: ' + sheet.rapport + '/100 (moves on its own as you talk)' }), rp,
      el('label', { textContent: 'Cussing: ' + ['never', 'mild', 'casual', 'free'][sheet.cussLevel] }), cl,
      el('label', {}, dev, ' Let her pick up cussing over time (only once rapport is 60+ and you cuss yourself)'));
  } else if (k === 'voice') {
    p.append(el('h3', { textContent: 'Talk to text' }));
    if (!voice.supported) { p.append(el('div', { className: 'note', textContent: 'This browser has no speech recognition. Use Chrome, Edge or Safari.' })); return; }
    const on = el('input', { type: 'checkbox', checked: voice.on }); on.onchange = () => { voice.set({ on: on.checked }); drawRing(); };
    const w = el('input', { type: 'range', min: 1, max: 8, step: 0.5, value: voice.wait });
    const lab = el('label', { textContent: 'Send after you stop talking for ' + voice.wait + ' s' });
    w.oninput = () => { lab.textContent = 'Send after you stop talking for ' + w.value + ' s'; };
    w.onchange = () => { voice.set({ wait: +w.value }); drawRing(); };
    p.append(el('label', {}, on, ' Listen (on by default; the mic button by the text box turns it on and off)'), lab, w,
      el('div', { className: 'scale' }, el('span', { textContent: 'quick' }), el('span', { textContent: 'patient' })),
      el('div', { className: 'note', textContent: 'A thin bar over the text box fills while it waits. Typing stops the auto-send for that message. Speech is turned into text by your browser (Chrome and Edge use Google or Microsoft servers for this).' }));
  } else if (k === 'secret') {
    p.append(el('h3', { textContent: 'Hidden likes' }), el('div', { className: 'note', textContent: 'Dashed = still secret, filled = she has told you. Tap one to flip it. She can grow new ones from good moments; those say (grew). She only admits a secret once she trusts you enough.' }), listEditor('', 'hiddenLikes', true));
  }
}
async function openWheel() {
  const r = await api('/api/settings'); const d = await r.json(); settings = d.settings; sheet = d.sheet;
  drawRing(); $('panel').classList.remove('show'); $('wheel').classList.add('open');
}
function closeWheel() { $('wheel').classList.remove('open'); }
$('closeWheel').onclick = closeWheel;
document.querySelector('#herCol img').onclick = () => openWheel().catch(() => {});

async function brainStatus() {
  try {
    const b = await (await fetch('/api/brain')).json();
    $('brainDot').textContent = b.online ? '\u25cf PC online' : b.fallback ? '\u25cf Claude' : '\u25cb offline';
    $('brainDot').style.color = b.online ? '#7bd88f' : b.fallback ? '#d4b8ff' : '#ff9a9a';
  } catch {}
}
brainStatus(); setInterval(brainStatus, 20000);
load().then(() => voice.start()).catch(() => {});
