app = "brenai"
primary_region = "iad"

[build]

[env]
  USER_NAME = "Andrew"
  CONTEXT_TOKENS = "32768"   # match the context the model is loaded with in Bionic
  MODEL = "claude-opus-5-5"  # only used as a backup when the PC is offline and ANTHROPIC_API_KEY is set
  EFFORT = "low"

[mounts]
  source = "brenai_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
