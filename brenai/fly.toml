app = "brenai"
primary_region = "iad"

[build]

[env]
  MODEL = "claude-opus-5-5"
  EFFORT = "low"
  USER_NAME = "Andrew"

[mounts]
  source = "brenai_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
