<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Table game 3D harness</title>
<link rel="stylesheet" href="/css/style.css">
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe6c8} canvas{display:block}</style>
</head><body>
<script type="module">
// A game's pieces on a world table (game-waves <id>-3d.js through tg-games.js table3dFor), a bot game of its engine run here
// in the page, drawn with the game's toon materials and ink pass. ?game=word-weave&players=3&seed=7&table=store|picnic
// In the page: __adv(k) plays k moves and updates the pieces, __end(), __cam('player'|'above'|'low'), __stats(), __same().
import * as THREE from 'three';
import { InkPass, toon } from '/js/toon.js';
import { Batcher, GEO } from '/js/batch.js';
import { ready, table3dFor } from '/js/table-games/tg-games.js';

const Q = new URLSearchParams(location.search);
const GAME = Q.get('game') || 'word-weave', N = Number(Q.get('players') || 3), SEED = Number(Q.get('seed') || 7), KIND = Q.get('table') || 'store';
window.__errors = [];
addEventListener('error', e => window.__errors.push(String(e.message)));
addEventListener('unhandledrejection', e => window.__errors.push(String(e.reason && e.reason.stack || e.reason)));
const oldErr = console.error; console.error = (...a) => { window.__errors.push(a.map(String).join(' ')); oldErr(...a); };

const E = (await import(`/engines/${GAME}.js`)).default;
await ready;

// ---- the scene: a warm room floor, a table and chairs
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#bcd9e8');
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 60);
scene.add(new THREE.HemisphereLight('#fff4dc', '#7a6a58', 1.4));
const sun = new THREE.DirectionalLight('#fff1d6', 2.2); sun.position.set(2.5, 5, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: 0.5, far: 12 }); sun.shadow.bias = -0.0005;
scene.add(sun);
const ink = new InkPass(renderer); ink.setSize(innerWidth, innerHeight);

const b = new Batcher({ castShadow: true, receiveShadow: true, vertexColors: true });
b.add(GEO.box, '#c99a62', { y: -0.01, sx: 12, sy: 0.02, sz: 12 }); // floor boards
for (let i = -6; i < 6; i++) b.add(GEO.box, '#b8874f', { x: i + 0.5, y: 0.001, sx: 0.02, sy: 0.002, sz: 12 });
let d;
const NCH = KIND === 'picnic' ? Math.max(N, 4) : Math.max(N, 6);
if (KIND === 'picnic') {
  // a picnic table: a long top (1.8 x 0.7), benches both sides
  const top = 0.74, hw = 0.9, hd = 0.35;
  b.add(GEO.box, '#a8743f', { y: top - 0.025, sx: hw * 2, sy: 0.05, sz: hd * 2 });
  for (let i = -3; i <= 3; i++) b.add(GEO.box, '#8e5f33', { x: i * 0.26, y: top + 0.0005, sx: 0.006, sy: 0.001, sz: hd * 2 });
  for (const s of [-1, 1]) { b.add(GEO.box, '#8e5f33', { z: s * 0.62, y: 0.43, sx: hw * 2, sy: 0.04, sz: 0.26 }); for (const x of [-0.7, 0.7]) b.add(GEO.box, '#6e4224', { x, z: s * 0.3, y: 0.36, sx: 0.06, sy: 0.72, sz: 0.5, rx: s * 0.4 }); }
  const seats = [];
  for (let i = 0; i < NCH; i++) { const side = i % 2 ? -1 : 1, k = Math.floor(i / 2), m = Math.ceil(NCH / 2); seats.push({ x: (k - (m - 1) / 2) * 0.6, z: side * 0.62 }); }
  const rectEdge = a => { const dx = Math.sin(a), dz = Math.cos(a); return Math.min(hw / Math.max(1e-6, Math.abs(dx)), hd / Math.max(1e-6, Math.abs(dz))); };
  d = { id: 'h3d', x: 0, z: 0, top, R: 0.4, edge: rectEdge, seats, parent: scene };
} else {
  // the game store's round gaming table: wood rim, green felt, chairs round it
  const top = 0.74, TR = 0.95;
  b.add(GEO.cyl12, '#9a6538', { y: top - 0.035, sx: TR, sy: 0.06, sz: TR });
  b.add(GEO.cyl12, '#2f6b4f', { y: top - 0.003, sx: TR - 0.12, sy: 0.006, sz: TR - 0.12 });
  b.add(GEO.cyl8, '#6e4224', { y: top / 2 - 0.03, sx: 0.12, sy: top - 0.06, sz: 0.12 });
  b.add(GEO.cyl12, '#6e4224', { y: 0.02, sx: 0.5, sy: 0.04, sz: 0.5 });
  const seats = [];
  for (let i = 0; i < NCH; i++) { const a = i / NCH * Math.PI * 2 + 0.3; seats.push({ x: Math.sin(a) * 1.25, z: Math.cos(a) * 1.25 }); }
  d = { id: 'h3d', x: 0, z: 0, top, R: TR - 0.22, edge: () => TR, seats, parent: scene };
}
for (const s of d.seats) { // simple chairs facing the table
  const a = Math.atan2(s.x, s.z);
  if (KIND === 'picnic') continue;
  b.add(GEO.box, '#b0703a', { x: s.x, y: 0.45, z: s.z, sx: 0.42, sy: 0.05, sz: 0.42, ry: a });
  b.add(GEO.box, '#8e5a2e', { x: s.x + Math.sin(a) * 0.2, y: 0.72, z: s.z + Math.cos(a) * 0.2, sx: 0.42, sy: 0.5, sz: 0.05, ry: a });
  for (const [u, v] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) b.add(GEO.box, '#6e4224', { x: s.x + Math.cos(a) * u * 0.18 + Math.sin(a) * v * 0.18, y: 0.22, z: s.z - Math.sin(a) * u * 0.18 + Math.cos(a) * v * 0.18, sx: 0.04, sy: 0.44, sz: 0.04 });
}
b.build(scene, 'room');

// ---- the game, bots in every seat
const players = Array.from({ length: N }, (_, i) => ({ name: 'P' + i, bot: 'normal', kind: 'bot' }));
const settings = {}; for (const sp of E.settings || []) settings[sp.key] = sp.default;
let state = E.newGame({ players, settings, seed: SEED });
let rngA = SEED >>> 0; const rng = () => { rngA = (rngA + 0x6d2b79f5) >>> 0; let t = rngA; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const ok = (seat, m) => (E.check && m && (m.type === 'place' || m.type === 'exchange') ? E.check(state, seat, m) === null : (E.legalMoves(state, seat) || []).some(x => JSON.stringify(x) === JSON.stringify(m)));
const over = () => { try { return !!E.score(state).done; } catch { return false; } };
function step() {
  if (over()) return false;
  const v0 = E.view(state, null), ord = [];
  if (Number.isInteger(v0.turn) && v0.turn >= 0) ord.push(v0.turn);
  for (let s = 0; s < N; s++) if (!ord.includes(s)) ord.push(s);
  for (const s of ord) {
    const moves = E.legalMoves(state, s) || []; if (!moves.length) continue;
    const nx = moves.find(m => m.type === 'next'); let m = nx || null;
    if (!m) { const v = E.view(state, s); if (!Array.isArray(v.moves)) v.moves = moves; try { m = E.bot(v, 'normal', rng); } catch (e) { console.error('bot', e); } if (m && m.move) m = m.move; }
    if (!m || !ok(s, m)) m = moves.find(x => x.type === 'pass' || x.type === 'end') || moves.find(x => x.type !== 'place' && x.type !== 'exchange');
    if (!m) continue;
    state = E.apply(state, s, m).state; return true;
  }
  return false;
}
// engine seat k sits in chair order[k]: spread round the table
const order = players.map((_, k) => Math.floor(k * NCH / N));
const pieces = table3dFor(GAME, d.parent, d);
let moves = 0;
const phaseOf = () => (over() ? 'over' : 'play');
function push() { pieces.update(E.view(state, null), order, phaseOf()); }
push();
window.__adv = k => { for (let i = 0; i < k; i++) { if (!step()) break; moves++; if (moves % 4 === 0) push(); } push(); return moves; };
window.__end = () => { for (let i = 0; i < 20000 && step(); i++) moves++; push(); return moves; };
window.__view = () => E.view(state, null);
window.__stats = () => { renderer.info.reset(); renderer.info.autoReset = false; draw(); const calls = renderer.info.render.calls; renderer.info.autoReset = true; let meshes = 0, tris = 0; pieces.root.traverse(o => { if (o.isMesh && o.visible) { meshes++; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } }); return { moves, meshes, tris: Math.round(tris), sceneCalls: calls, drawn: pieces.drawn ? pieces.drawn() : null, phase: phaseOf() }; };
// update() with an unchanged view (a fresh copy of the same public view) must not rebuild
window.__same = () => { const a = pieces.drawn().builds; pieces.update(JSON.parse(JSON.stringify(E.view(state, null))), order.slice(), phaseOf()); pieces.update(E.view(state, null), order, phaseOf()); return { before: a, after: pieces.drawn().builds }; };
const CAMS = {
  player: () => { const s = d.seats[order[0]] || d.seats[0], a = Math.atan2(s.x, s.z), r = Math.hypot(s.x, s.z) + 0.05; return [[Math.sin(a) * r, d.top + 0.5, Math.cos(a) * r], [0, d.top, -0.0]]; },
  above: () => [[0.02, d.top + 1.05, 0.12], [0, d.top, 0]],
  low: () => { const s = d.seats[order[Math.min(1, N - 1)]], a = Math.atan2(s.x, s.z); return [[Math.sin(a) * 1.05, d.top + 0.32, Math.cos(a) * 1.05], [0, d.top + 0.02, 0]]; },
  passer: () => [[2.6, 1.65, 1.9], [0, d.top, 0]],
};
window.__cam = k => { const [p, t] = CAMS[k](); camera.position.set(...p); camera.lookAt(...t); draw(); return k; };
let last = performance.now();
function draw() { const now = performance.now(); pieces.tick && pieces.tick(Math.min(0.1, (now - last) / 1000), E.view(state, null), order); last = now; ink.render(scene, camera); }
window.__cam('player');
window.__draw = draw;
window.__ready = true;
</script></body></html>
