<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brene hands</title>
<style>
  body{margin:0;background:#0d0f16;color:#eee;font:18px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
  #wrap{position:relative;width:min(96vw,720px);aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;padding:12px 20px;border-radius:12px;border:0;background:#2a2f48;color:#fff;cursor:pointer}
  button.on{background:#3a9a6e} #msg{color:#aab;min-height:1.4em;text-align:center}
</style></head><body>
<h2 style="margin:4px">Hand control for VaM</h2>
<div id="wrap"><video id="v" playsinline muted></video><canvas id="c"></canvas></div>
<div class="row"><button id="go">Start camera</button><button id="cam">Next camera</button><button id="mir" class="on">Mirror</button></div>
<div id="msg">Close your hand (or pinch) over a control point in VaM to hold it. Open it to let go. Leave this tab open.</div>
<script type="module">
// Your camera is read here by MediaPipe's hand tracker; only hand positions (no picture) go to the relay on this PC.
// The gesture maths is the same as Brenai's photo studio (brenai/public/hands.js): pinch and fist measured against the hand's size.
const LIB = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const $ = id => document.getElementById(id), v = $('v'), c = $('c'), g = c.getContext('2d'), msg = t => $('msg').textContent = t;
let tracker = null, stream = null, mirror = true, camIx = +(localStorage.breneCam || 0), last = [], nextId = 1, lastT = -1, sending = false;

function read(p, old) {
  const d = (a, b) => Math.hypot(p[a].x - p[b].x, p[a].y - p[b].y), size = d(0, 9) || 1e-3, gap = d(4, 8) / size;
  const pinch = old && old.pinch ? gap < 0.42 : gap < 0.28;
  const curl = [[8, 5], [12, 9], [16, 13], [20, 17]].reduce((a, [t, m]) => a + d(t, 0) / (d(m, 0) || 1e-3), 0) / 4;
  const closed = old && old.closed ? curl < 1.55 : curl < 1.3;
  let x = [0, 5, 9, 13, 17].reduce((a, i) => a + p[i].x, 0) / 5, y = [0, 5, 9, 13, 17].reduce((a, i) => a + p[i].y, 0) / 5;
  if (mirror) x = 1 - x;
  const fit = q => Math.max(0, Math.min(1, (q - 0.15) / 0.7));   // the middle 70% of the picture covers the whole screen
  return { x: fit(x), y: fit(y), size, pinch, closed };
}
function track(list) {
  const out = [], used = new Set();
  for (const p of list) {
    const r0 = read(p, null); let best = -1, bd = 0.25;
    last.forEach((h, i) => { if (used.has(i)) return; const dd = Math.hypot(h.x - r0.x, h.y - r0.y); if (dd < bd) { bd = dd; best = i; } });
    const old = best >= 0 ? last[best] : null; if (old) used.add(best);
    const r = read(p, old), k = 0.5;
    if (old) { r.x = old.x + (r.x - old.x) * k; r.y = old.y + (r.y - old.y) * k; r.size = old.size + (r.size - old.size) * 0.35; }
    r.id = old ? old.id : nextId++; out.push(r);
  }
  return out;
}
function draw(list) {
  c.width = c.clientWidth; c.height = c.clientHeight; g.clearRect(0, 0, c.width, c.height);
  for (const h of list) {
    const x = h.x * c.width, y = h.y * c.height;
    g.beginPath(); g.arc(x, y, 22, 0, 7); g.lineWidth = 5; g.strokeStyle = h.closed || h.pinch ? '#ffb030' : '#9c8cff'; g.stroke();
    if (h.closed || h.pinch) { g.fillStyle = 'rgba(255,176,48,.4)'; g.fill(); }
  }
}
async function post(list) {
  if (sending) return; sending = true;
  try { await fetch('/hands', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ hands: list.map(({ id, x, y, size, pinch, closed }) => ({ id, x, y, size, pinch, closed })) }) }); }
  catch { msg('The relay is not answering. Is brene-relay running?'); }
  sending = false;
}
function loop() {
  if (!stream) return;
  if (tracker && v.readyState >= 2 && v.currentTime !== lastT) {
    lastT = v.currentTime;
    const r = tracker.detectForVideo(v, performance.now());
    last = track(r.landmarks || []); draw(last); post(last);
  }
  requestAnimationFrame(loop);
}
async function start() {
  try {
    if (!tracker) {
      msg('Loading the hand tracker...');
      const vision = await import(LIB + '/vision_bundle.mjs');
      const files = await vision.FilesetResolver.forVisionTasks(LIB + '/wasm');
      tracker = await vision.HandLandmarker.createFromOptions(files, { baseOptions: { modelAssetPath: MODEL, delegate: 'GPU' }, runningMode: 'VIDEO', numHands: 2 });
    }
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video: true });
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    if (cams.length > 1) { stream.getTracks().forEach(t => t.stop()); stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: cams[camIx % cams.length].deviceId }, width: 640, height: 480 } }); }
    v.srcObject = stream; await v.play();
    v.style.transform = c.style.transform = '';
    if (mirror) v.style.transform = 'scaleX(-1)';
    $('go').textContent = 'Running'; $('go').classList.add('on');
    msg('Camera ' + ((camIx % Math.max(1, cams.length)) + 1) + ' of ' + cams.length + '. Close your hand over a control point in VaM to hold it.');
    loop();
  } catch (e) { msg('Could not start: ' + (e.message || e)); }
}
$('go').onclick = start;
$('cam').onclick = () => { camIx++; localStorage.breneCam = camIx; start(); };
$('mir').onclick = () => { mirror = !mirror; $('mir').classList.toggle('on', mirror); v.style.transform = mirror ? 'scaleX(-1)' : ''; };
</script></body></html>
