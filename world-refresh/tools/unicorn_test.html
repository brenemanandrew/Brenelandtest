<!doctype html><html><body style="margin:0;background:#bfe3f5">
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.js"}}</script>
<script type="module">
// Unicorn test bench (serve the TEST GAME root, open /unicorn_test.html): the game's own Unicorn (js/unicorn.js, the toy
// unicorns of tools/unicorn-toy.js) through the game's ink pass (toon.js InkPass, with the test game's vibrant grade).
//   ?mode=line      the five (Sprinkles, Moonpie, Clover, Noodle, Bean) side by side, 3/4 view
//   ?mode=turn&who=sprinkles   one unicorn from six angles
//   ?mode=poses&who=clover     one unicorn in stand, walk, trot, graze, prance, neigh, nuzzle, sleep
//   &night  a night light
import * as THREE from 'three';
import { Unicorn } from '/js/unicorn.js';
import { NPCS } from '/js/npc-looks.js';
import { InkPass } from '/js/toon.js';
const q = new URLSearchParams(location.search), MODE = q.get('mode') || 'line', WHO = q.get('who') || 'sprinkles', NIGHT = q.has('night');
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true }); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.NeutralToneMapping; r.toneMappingExposure = 1.0; r.shadowMap.enabled = true; document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(NIGHT ? '#1a2240' : '#9fd4f0');
sc.add(new THREE.HemisphereLight(NIGHT ? 0x6a78b0 : 0xdff2ff, NIGHT ? 0x223322 : 0x6f9a55, NIGHT ? 0.7 : 1.2));
const dl = new THREE.DirectionalLight(NIGHT ? 0x9fb0ff : 0xfff2dc, NIGHT ? 0.8 : 2.8); dl.position.set(-4, 8, 6); dl.castShadow = true; dl.shadow.mapSize.set(1024, 1024); Object.assign(dl.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); sc.add(dl);
const gnd = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshToonMaterial({ color: '#7cc84f' })); gnd.rotation.x = -Math.PI / 2; gnd.receiveShadow = true; sc.add(gnd);
const saved = { sprinkles: { color: '#ffc6e0', mane: ['#ff6b6b', '#ffb347', '#fff27a', '#b48cff'], mark: 'heart', socks: 'all', blaze: false, build: 'classic', hornLen: 1.35 } };   // (the live server's saved look)
const look = id => ({ ...NPCS[id].look, ...(saved[id] || {}) });
const list = [];   // [unicorn, speed, anim]
const add = (id, x, z, yaw, sp = 0, anim = null) => { const u = new Unicorn(look(id)); u.root.position.set(x, 0, z); u.root.rotation.y = yaw; sc.add(u.root); list.push([u, sp, anim]); return u; };
let cam = new THREE.PerspectiveCamera(28, W / H, 0.1, 200);
if (MODE === 'line') {
  ['sprinkles', 'moonpie', 'clover', 'noodle', 'bean'].forEach((id, i) => add(id, (i - 2) * 1.45, 0, 0.75));
  cam.position.set(1.2, 2.2, 8.6); cam.lookAt(0, 0.62, 0);
} else if (MODE === 'turn') {
  for (let i = 0; i < 6; i++) add(WHO, (i - 2.5) * 1.5, 0, i * Math.PI / 3);
  cam.position.set(0, 2.0, 9.8); cam.lookAt(0, 0.6, 0);
} else {
  [[0, null], [1.2, null], [2.8, null], [0, 'graze'], [0, 'prance'], [0, 'neigh'], [0, 'nuzzle'], [0, 'sleep']].forEach(([sp, a], i) => add(WHO, (i - 3.5) * 1.5, 0, Math.PI / 2, sp, a));
  cam.position.set(0, 2.0, 12.5); cam.lookAt(0, 0.6, 0);
}
const ink = new InkPass(r, { quality: 'high' }); ink.setSize(W, H);
let t = 0, n = +(q.get('frames') || 150);
for (let k = 0; k < n; k++) { t += 1 / 30; for (const [u, sp, a] of list) u.update(1 / 30, t, sp, a); }
sc.updateMatrixWorld(true);
ink.render(sc, cam);
window.READY = 1;
</script></body></html>
